77.4" x2="578.3" y2="677.4" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="691.6" x2="578.3" y2="691.6" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="705.7" x2="578.3" y2="705.7" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="719.9" x2="578.3" y2="719.9" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="734.1" x2="578.3" y2="734.1" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="748.2" x2="578.3" y2="748.2" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="762.4" x2="578.3" y2="762.4" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="776.6" x2="578.3" y2="776.6" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="790.7" x2="578.3" y2="790.7" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="804.9" x2="578.3" y2="804.9" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="819.1" x2="578.3" y2="819.1" stroke="#DED7C5" stroke-width="0.17"/><line x1="17" y1="833.3" x2="578.3" y2="833.3" stroke="#DED7C5" stroke-width="0.17"/>
