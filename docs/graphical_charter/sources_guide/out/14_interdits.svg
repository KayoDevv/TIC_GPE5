<text x="56.7" y="64.9" font-family="Cinzel Regular" font-size="6.8" fill="#936F3C" letter-spacing="1.7">12 — LES INTERDITS</text>
<text x="538.6" y="64.9" font-family="Space Mono" font-size="6.8" fill="#6B6552" letter-spacing="0.35" text-anchor="end">CLÔTURE</text>
<line x1="56.7" y1="69.5" x2="538.6" y2="69.5" stroke="#C9C0A9" stroke-width="0.57"/>

<text x="56.7" y="128.1" font-family="Cinzel SemiBold" font-size="24.4" fill="#1C1B16" letter-spacing="0.4">Les interdits</text><line x1="56.7" y1="133.2" x2="538.6" y2="133.2" stroke="#B08D57" stroke-width="1.13"/>
<text x="56.7" y="162.9" font-family="Spectral" font-size="9.1" fill="#3E3A30" font-style="italic">Cette liste n'est pas exhaustive — elle protège l'esprit du système, pas la lettre.</text>
<text x="56.7" y="202.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="72.7" y="202.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Ajouter une quatrième teinte — même un gris neutre,</text>
<text x="72.7" y="215.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">même un bleu « technique ».</text>
<line x1="72.7" y1="227.9" x2="270.65000000000003" y2="227.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="314.65000000000003" y="202.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="330.65000000000003" y="202.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Remplir l'iris ou les paupières du symbole — seule</text>
<text x="330.65000000000003" y="215.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">la pupille reste pleine.</text>
<line x1="330.65000000000003" y1="227.9" x2="528.6" y2="227.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="56.7" y="249.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="72.7" y="249.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Appliquer une ombre portée, un dégradé ou un effet</text>
<text x="72.7" y="262.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">de profondeur sur le symbole.</text>
<line x1="72.7" y1="274.9" x2="270.65000000000003" y2="274.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="314.65000000000003" y="249.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="330.65000000000003" y="249.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Mélanger plus de deux graisses de Cinzel sur un même</text>
<text x="330.65000000000003" y="262.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">support.</text>
<line x1="330.65000000000003" y1="274.9" x2="528.6" y2="274.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="56.7" y="296.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="72.7" y="296.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Utiliser les couleurs de verdict (vert, ambre,</text>
<text x="72.7" y="309.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">rouge) hors de l'interface produit.</text>
<line x1="72.7" y1="321.9" x2="270.65000000000003" y2="321.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="314.65000000000003" y="296.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="330.65000000000003" y="296.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Enfermer le logotype dans un cartouche, une forme</text>
<text x="330.65000000000003" y="309.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">fermée ou une bordure décorative.</text>
<line x1="330.65000000000003" y1="321.9" x2="528.6" y2="321.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="56.7" y="343.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="72.7" y="343.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Étirer la grecque en hauteur ou l'employer en fond</text>
<text x="72.7" y="356.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">pleine page — c'est un filet, pas une tapisserie.</text>
<line x1="72.7" y1="368.9" x2="270.65000000000003" y2="368.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="314.65000000000003" y="343.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="330.65000000000003" y="343.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Inventer un sixième état d'icône, ou animer hors de</text>
<text x="330.65000000000003" y="356.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">la grammaire du mouvement.</text>
<line x1="330.65000000000003" y1="368.9" x2="528.6" y2="368.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="56.7" y="390.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="72.7" y="390.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Recadrer une gravure dans le vif du sujet, ou la</text>
<text x="72.7" y="403.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">remplacer par une photographie couleur.</text>
<line x1="72.7" y1="415.9" x2="270.65000000000003" y2="415.9" stroke="#DED7C5" stroke-width="0.4"/>
<text x="314.65000000000003" y="390.9" font-family="Spectral SemiBold" font-size="11" fill="#936F3C">×</text>
<text x="330.65000000000003" y="390.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Employer l'or antique pour du texte courant sur fond</text>
<text x="330.65000000000003" y="403.9" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">sombre — la nuance #C7A66E s'y substitue.</text>
<line x1="330.65000000000003" y1="415.9" x2="528.6" y2="415.9" stroke="#DED7C5" stroke-width="0.4"/>
