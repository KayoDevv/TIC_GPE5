<text x="56.7" y="64.9" font-family="Cinzel Regular" font-size="6.8" fill="#936F3C" letter-spacing="1.7">P R É A M B U L E</text>
<text x="538.6" y="64.9" font-family="Space Mono" font-size="6.8" fill="#6B6552" letter-spacing="0.35" text-anchor="end">SOMMAIRE</text>
<line x1="56.7" y1="69.5" x2="538.6" y2="69.5" stroke="#C9C0A9" stroke-width="0.57"/>

<text x="56.7" y="128.1" font-family="Cinzel SemiBold" font-size="24.4" fill="#1C1B16" letter-spacing="0.4">Une marque qui trie</text>
<text x="56.7" y="160.1" font-family="Cinzel SemiBold" font-size="24.4" fill="#1C1B16" letter-spacing="0.4">ce qui a le droit de passer.</text>
<line x1="56.7" y1="166" x2="538.6" y2="166" stroke="#B08D57" stroke-width="1.13"/>
<text x="56.7" y="192.0" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">CHARON examine chaque fichier qu'un employé reçoit avant qu'il n'atteigne sa machine — une analyse</text>
<text x="56.7" y="206.3" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">statique, une détonation en sandbox isolée, une lecture sémantique du contexte. Trois passeurs</text>
<text x="56.7" y="220.6" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">indépendants, un seul verdict.</text>
<text x="56.7" y="244.6" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">L'identité visuelle emprunte au vocabulaire du musée et de la gravure : la gravité tranquille d'une</text>
<text x="56.7" y="258.9" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">salle de plâtres antiques, la précision d'un instrument de mesure. Trois couleurs, deux</text>
<text x="56.7" y="273.2" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">typographies, aucun ornement superflu — parce qu'un système de confiance n'a pas besoin de décor</text>
<text x="56.7" y="287.5" font-family="Spectral Medium" font-size="8.8" fill="#3E3A30">pour être pris au sérieux.</text>
<text x="56.7" y="311.5" font-family="Spectral" font-size="8.8" fill="#3E3A30" font-style="italic">Cette seconde édition étend le système au-delà du papier : un motif identitaire, une iconographie</text>
<text x="56.7" y="325.8" font-family="Spectral" font-size="8.8" fill="#3E3A30" font-style="italic">gravée, une grammaire du mouvement pour l'écran et la déclinaison web de la marque.</text>
<text x="56.7" y="371.8" font-family="Cinzel Regular" font-size="7.4" fill="#936F3C" letter-spacing="1.9">SOMMAIRE</text>
