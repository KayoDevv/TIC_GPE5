<text x="56.7" y="464.20000000000005" font-family="Spectral Medium" font-size="7.7" fill="#6B6552">Sur fond sombre — l'or reste identique ; seul le fond s'inverse.</text>
<text x="56.7" y="491.20000000000005" font-family="Cinzel Regular" font-size="7.4" fill="#936F3C" letter-spacing="1.9">RÈGLES D'USAGE</text>
<text x="56.7" y="509.20000000000005" font-family="Spectral Medium" font-size="8.8" fill="#936F3C">—</text>
<text x="72.7" y="509.20000000000005" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">La grecque est un filet : elle souligne une tête ou un pied de support, jamais un fond intégral.</text>
<text x="56.7" y="525.2" font-family="Spectral Medium" font-size="8.8" fill="#936F3C">—</text>
<text x="72.7" y="525.2" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Hauteur comprise entre 12 et 32 px (3 à 9 mm) — au-delà, elle devient décor.</text>
<text x="56.7" y="541.2" font-family="Spectral Medium" font-size="8.8" fill="#936F3C">—</text>
<text x="72.7" y="541.2" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Une seule frise par support. Elle court toujours d'un bord à l'autre, horizontale.</text>
<text x="56.7" y="557.2" font-family="Spectral Medium" font-size="8.8" fill="#936F3C">—</text>
<text x="72.7" y="557.2" font-family="Spectral Medium" font-size="8.5" fill="#3E3A30">Deux encres seulement : or sur parchemin, or sur noir profond. Jamais de version noire sur or.</text>

<line x1="56.7" y1="779.5" x2="538.6" y2="779.5" stroke="#C9C0A9" stroke-width="0.57"/>
