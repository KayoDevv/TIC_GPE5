<text x="56.7" y="64.9" font-family="Cinzel Regular" font-size="6.8" fill="#936F3C" letter-spacing="1.7">08 — LE MOTIF IDENTITAIRE</text>
<text x="538.6" y="64.9" font-family="Space Mono" font-size="6.8" fill="#6B6552" letter-spacing="0.35" text-anchor="end">LA GRECQUE</text>
<line x1="56.7" y1="69.5" x2="538.6" y2="69.5" stroke="#C9C0A9" stroke-width="0.57"/>

<text x="56.7" y="128.1" font-family="Cinzel SemiBold" font-size="24.4" fill="#1C1B16" letter-spacing="0.4">Le motif identitaire</text><line x1="56.7" y1="133.2" x2="538.6" y2="133.2" stroke="#B08D57" stroke-width="1.13"/>
<text x="56.7" y="162.9" font-family="Spectral" font-size="9.1" fill="#3E3A30" font-style="italic">La grecque — le méandre du fleuve que le passeur remonte sans fin. Un seul motif géométrique, hérité</text>
<text x="56.7" y="177.20000000000002" font-family="Spectral" font-size="9.1" fill="#3E3A30" font-style="italic">de la céramique attique : il borde, il scande, il n'envahit jamais.</text>
<text x="56.7" y="209.20000000000002" font-family="Cinzel Regular" font-size="7.4" fill="#936F3C" letter-spacing="1.9">CONSTRUCTION</text>
