<text x="56.7" y="400.20000000000005" font-family="Spectral Medium" font-size="7.7" fill="#6B6552">Sur parchemin — or antique, hauteur 26 px / 7 mm.</text>
<rect x="56.7" y="413.20000000000005" width="481.90000000000003" height="38" fill="#1C1B16"/>
