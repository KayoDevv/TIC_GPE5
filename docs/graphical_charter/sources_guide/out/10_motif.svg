<text x="116.7" y="300.20000000000005" font-family="Space Mono" font-size="7.1" fill="#6B6552" text-anchor="middle">1 motif = 5 × 5 modules</text>
<text x="116.7" y="312.20000000000005" font-family="Space Mono" font-size="6.1" fill="#8A8170" letter-spacing="0.4" text-anchor="middle">TRAIT = 0,85 MODULE — CONSTANT</text>
<text x="206.7" y="233.20000000000002" font-family="Cinzel SemiBold" font-size="10.2" fill="#1C1B16">Le module</text>
<text x="206.7" y="247.20000000000002" font-family="Spectral Medium" font-size="8.2" fill="#3E3A30">Le motif se construit sur une grille de 5 × 5 modules. Le</text>
<text x="206.7" y="259.8" font-family="Spectral Medium" font-size="8.2" fill="#3E3A30">trait garde une épaisseur constante de 0,85 module — ni</text>
<text x="206.7" y="272.40000000000003" font-family="Spectral Medium" font-size="8.2" fill="#3E3A30">pleins, ni déliés.</text>
<text x="206.7" y="300.40000000000003" font-family="Cinzel SemiBold" font-size="10.2" fill="#1C1B16">Le raccord</text>
<text x="206.7" y="314.40000000000003" font-family="Spectral Medium" font-size="8.2" fill="#3E3A30">Chaque motif s'enchaîne au suivant par la ligne de base.</text>
<text x="206.7" y="327.00000000000006" font-family="Spectral Medium" font-size="8.2" fill="#3E3A30">La grecque ne se découpe jamais en cours de motif : on</text>
<text x="206.7" y="339.6" font-family="Spectral Medium" font-size="8.2" fill="#3E3A30">arrondit toujours au motif entier.</text>
<text x="56.7" y="335.20000000000005" font-family="Cinzel Regular" font-size="7.4" fill="#936F3C" letter-spacing="1.9">LA FRISE</text>
<rect x="56.7" y="349.20000000000005" width="481.90000000000003" height="38" fill="#FBF9F3" stroke="#DED7C5" stroke-width="0.6"/>
