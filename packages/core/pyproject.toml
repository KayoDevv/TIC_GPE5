[project]
name = "zt-shared"
version = "0.1.0"
description = "Core Library for Kafka events and Pydantic validation"
authors = [{name = "Antigravity", email = "ai@zero-trust.local"}]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "zt_shared", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = {extras = ["email"], version = "^2.5.0"}
aiokafka = ">=0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
pytest-cov = "^4.1.0"
ruff = "^0.1.6"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
select = ["E", "F", "B", "I"]

[tool.coverage.run]
branch = true
source = ["src/zt_shared"]

[tool.coverage.report]
fail_under = 100
show_missing = true
