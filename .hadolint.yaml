# hadolint configuration — Dockerfile lint severity.
# Aligned with the repo's .yamllint.yml: we REPORT everything, but only rules
# of level >= warning fail the CI.
#
# DL3059 (multiple consecutive RUN) is "info" level: it is layer hygiene, not a
# security risk nor a significant size concern here (no temp cleanup to merge).
# We keep it visible in the logs without breaking the build.
failure-threshold: warning
