name: Deploy core pipeline (OpenVPN + SSH)

# Deploys the core analysis pipeline (redis + backend/ml/verdict/llm) AND the
# sandbox layer (sandbox-consumer) to GPE-NYX from a GitHub-HOSTED runner, using
# the same OpenVPN+SSH pattern as deploy-monitoring.yml.
#
# Triggering:
#   * runs AFTER "CD - Build, Push & Deploy" succeeds on main (workflow_run) so
#     the sha- tagged images are already in GHCR before we pin them — no race.
#   * the `detect` job then SKIPS unless the merge actually touched a pipeline
#     OR sandbox image's source / manifest. Each namespace rolls independently:
#     a pipeline-only change won't touch sandbox and vice-versa. A docs /
#     frontend-only merge redeploys nothing.
#   * workflow_dispatch always deploys both (manual override).
#
# Required secrets (already provisioned): VPN_OVPN, SSH_HOST, SSH_USER,
# SSH_PRIVATE_KEY. VM prerequisites (one-time): `ghcr-pull` imagePullSecret +
# `llm-secrets` in the pipeline namespace, and `make tf-apply` for the namespace
# + kafka-allow NetworkPolicy. See applications/pipeline/README.md.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CD - Build, Push & Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  SSH_OPTS: "-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
  OWNER: kayodevv
  # If the SSH user's default kubeconfig isn't the K3s one, set this to e.g.
  # /home/tisser_f/.kube/config (as deploy-monitoring.yml does).
  REMOTE_KUBECONFIG: ""

jobs:
  # Deploy only when the triggering merge changed a pipeline image's source or a
  # pipeline manifest (and cd-deploy succeeded). Manual dispatch always deploys.
  detect:
    runs-on: ubuntu-latest
    # Never deploy Dependabot bumps: cd-deploy skips building them, so pinning
    # their sha would ImagePullBackOff anyway. Manual dispatch always deploys.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(deps') &&
          !startsWith(github.event.workflow_run.head_commit.message, 'ci(deps') }}
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      pipeline: ${{ steps.check.outputs.pipeline }}   # roll the pipeline namespace
      sandbox: ${{ steps.check.outputs.sandbox }}     # roll the sandbox-consumer
      sandbox_rebuilt: ${{ steps.check.outputs.sandbox_rebuilt }}  # consumer IMAGE was rebuilt
      short: ${{ steps.check.outputs.short }}
      services: ${{ steps.check.outputs.services }}   # pipeline workers whose IMAGE was rebuilt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - id: check
        run: |
          set -euo pipefail
          # cd-deploy's docker/metadata-action tags images `sha-<7-char short>`,
          # so we pin the SHORT sha, not the full one.
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

          DIFF=$(git diff --name-only HEAD~1 HEAD || true)
          # A _global change makes cd-deploy rebuild every service (mirror that).
          GLOBAL='^(\.github/workflows/(ci-build|ci-tests|cd-deploy)\.yml|\.github/service-matrix\.json|\.github/filters\.yml|\.trivyignore|\.github/actions/)'
          svc=""
          if echo "$DIFF" | grep -qE "$GLOBAL"; then
            svc="core-backend ml-layer verdict-layer llm-layer"
          else
            echo "$DIFF" | grep -qE '^(apps/core-backend/|packages/core/)'          && svc="$svc core-backend"
            echo "$DIFF" | grep -qE '^(apps/workers/ml_layer/|packages/core/)'       && svc="$svc ml-layer"
            echo "$DIFF" | grep -qE '^(apps/workers/verdict_layer/|packages/core/)'  && svc="$svc verdict-layer"
            echo "$DIFF" | grep -qE '^(apps/workers/llm_layer/|packages/core/)'      && svc="$svc llm-layer"
          fi
          svc=$(echo $svc | xargs -n1 2>/dev/null | sort -u | xargs || true)
          echo "services=$svc" >> "$GITHUB_OUTPUT"

          dispatch=${{ github.event_name == 'workflow_dispatch' }}

          # Pipeline ns: roll if a pipeline image was rebuilt or a pipeline manifest changed.
          manifest=false
          echo "$DIFF" | grep -qE '^infrastructure/k8s-manifests/applications/pipeline/' && manifest=true
          pipeline=false
          { [ "$dispatch" = "true" ] || [ -n "$svc" ] || [ "$manifest" = "true" ]; } && pipeline=true
          echo "pipeline=$pipeline" >> "$GITHUB_OUTPUT"

          # Sandbox ns: roll if the sandbox source or its manifests changed. A
          # _global change (handled above via $svc) rebuilds every image incl. the
          # sandbox consumer, so mirror that here too.
          sandbox=false
          if [ "$dispatch" = "true" ] \
             || echo "$DIFF" | grep -qE '^(apps/workers/sandbox_layer/|infrastructure/k8s-manifests/(applications/sandbox/|overlays/))' \
             || echo "$DIFF" | grep -qE "$GLOBAL"; then
            sandbox=true
          fi
          echo "sandbox=$sandbox" >> "$GITHUB_OUTPUT"

          # Was the consumer IMAGE rebuilt this merge? (source or _global change).
          # If not — a manifest-only merge OR a manual dispatch — the apply keeps
          # the running image instead of pinning a sha- tag cd-deploy never pushed.
          sandbox_rebuilt=false
          if echo "$DIFF" | grep -qE '^apps/workers/sandbox_layer/' \
             || echo "$DIFF" | grep -qE "$GLOBAL"; then
            sandbox_rebuilt=true
          fi
          echo "sandbox_rebuilt=$sandbox_rebuilt" >> "$GITHUB_OUTPUT"

          if [ "$pipeline" = "true" ] || [ "$sandbox" = "true" ]; then
            echo "deploy -> pipeline=$pipeline (services=[$svc] manifest=$manifest) sandbox=$sandbox dispatch=$dispatch"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "no pipeline/sandbox change -> skip"; echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: ${{ needs.detect.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenVPN client
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Connect to OpenVPN
        run: |
          set -euo pipefail
          echo "${{ secrets.VPN_OVPN }}" > vpn.ovpn
          sudo openvpn --config vpn.ovpn --daemon --log vpn.log --writepid vpn.pid
          echo "Waiting for tun0..."
          timeout 60 bash -c 'until ip link show tun0 >/dev/null 2>&1; do sleep 2; done' \
            || { echo "::error::VPN tunnel did not come up"; sudo cat vpn.log; exit 1; }
          ip -br a show tun0

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Reachability check (SSH + K3s)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "${REMOTE_KUBECONFIG:+KUBECONFIG=$REMOTE_KUBECONFIG} kubectl get nodes -o wide"

      - name: Ship pipeline manifests to VM
        if: ${{ needs.detect.outputs.pipeline == 'true' }}
        run: |
          set -euo pipefail
          tar czf - -C infrastructure/k8s-manifests/applications pipeline \
          | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -rf ~/charon-deploy/pipeline && mkdir -p ~/charon-deploy && tar xzf - -C ~/charon-deploy'

      - name: Apply pipeline (pin rebuilt services to new sha, keep the rest)
        if: ${{ needs.detect.outputs.pipeline == 'true' }}
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "OWNER=$OWNER SHORT='${{ needs.detect.outputs.short }}' CHANGED='${{ needs.detect.outputs.services }}' KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/pipeline
            # Build a kustomize image override: rebuilt workers -> sha-SHORT;
            # untouched workers -> whatever tag they currently run (so apply -k
            # doesn't reset them to :latest and roll them needlessly).
            {
              echo ""
              echo "images:"
              for s in core-backend ml-layer verdict-layer llm-layer; do
                if echo " $CHANGED " | grep -q " $s "; then
                  tag="sha-$SHORT"
                else
                  cur=$(k -n pipeline get deploy/$s -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
                  tag="${cur##*:}"; [ -z "$tag" ] && tag="sha-$SHORT"
                fi
                echo "  - name: ghcr.io/$OWNER/charon-$s"
                echo "    newTag: $tag"
              done
            } >> kustomization.yaml
            k apply -k .
            # Roll (and wait on) only what actually changed.
            for s in $CHANGED; do k -n pipeline rollout status "deploy/$s" --timeout=180s; done
            k -n pipeline get pods -o wide
          REMOTE

      - name: Ship sandbox manifests to VM
        if: ${{ needs.detect.outputs.sandbox == 'true' }}
        run: |
          set -euo pipefail
          # Ship the overlays/prod overlay AND the base it references (its
          # kustomization uses ../../applications/sandbox), preserving the
          # k8s-manifests layout so the relative path resolves on the node.
          tar czf - -C infrastructure/k8s-manifests overlays/prod applications/sandbox \
          | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -rf ~/charon-deploy/km && mkdir -p ~/charon-deploy/km && tar xzf - -C ~/charon-deploy/km'

      - name: Apply sandbox (overlays/prod — in-cluster DNS + gVisor)
        if: ${{ needs.detect.outputs.sandbox == 'true' }}
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "OWNER=$OWNER SHORT='${{ needs.detect.outputs.short }}' REBUILT='${{ needs.detect.outputs.sandbox_rebuilt }}' KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/km
            # The consumer pulls from private GHCR but the sandbox ns may lack the
            # pull secret — clone it once from the pipeline ns (same registry creds).
            if ! k -n sandbox get secret ghcr-pull >/dev/null 2>&1; then
              k -n pipeline get secret ghcr-pull -o yaml \
                | grep -vE '^\s*(namespace|resourceVersion|uid|creationTimestamp):' \
                | k apply -n sandbox -f -
            fi
            # Rebuilt this merge -> pin the new sha; otherwise keep the running image
            # (cd-deploy only pushes a sha- tag when the consumer SOURCE changed;
            # a manifest-only merge or manual dispatch keeps whatever runs now).
            if [ "$REBUILT" = "true" ]; then
              tag="sha-$SHORT"
            else
              cur=$(k -n sandbox get deploy/sandbox-consumer -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
              tag="${cur##*:}"; [ -z "$tag" ] && tag="sha-$SHORT"
            fi
            # Apply the prod OVERLAY (base = ns-scoped consumer/secret/KEDA;
            # overlay wires in-cluster Kafka/MinIO DNS + gVisor). Pin the image in
            # the overlay's images: (replace its `images: []` placeholder).
            grep -vE '^images:\s*\[\]\s*$' overlays/prod/kustomization.yaml > overlays/prod/kustomization.yaml.tmp
            mv overlays/prod/kustomization.yaml.tmp overlays/prod/kustomization.yaml
            {
              echo ""
              echo "images:"
              echo "  - name: ghcr.io/$OWNER/charon-sandbox-consumer"
              echo "    newTag: $tag"
            } >> overlays/prod/kustomization.yaml
            k apply -k overlays/prod
            k -n sandbox rollout status deploy/sandbox-consumer --timeout=180s
            # The consumer has no readiness probe, so "rolled out" can mask a pod
            # that Runs then crashes seconds later (e.g. bad Kafka endpoint). Give
            # it a moment and fail loudly if it's restarting.
            sleep 12
            rs=$(k -n sandbox get pods -l app=sandbox-consumer \
                   -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount}{"\n"}{end}' \
                 | sort -rn | head -1)
            if [ "${rs:-0}" -gt 0 ]; then
              echo "::error:: sandbox-consumer restarted ${rs}x after rollout — crashlooping"
              k -n sandbox logs deploy/sandbox-consumer --tail=40 || true
              exit 1
            fi
            k -n sandbox get pods -o wide
          REMOTE

      - name: Disconnect VPN
        if: always()
        run: sudo test -f vpn.pid && sudo kill "$(cat vpn.pid)" || true
