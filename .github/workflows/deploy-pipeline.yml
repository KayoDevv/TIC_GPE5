name: Deploy core pipeline (OpenVPN + SSH)

# Rolls the pipeline (redis + backend/ml/verdict/llm) AND the sandbox-consumer
# onto GPE-NYX AT A VERSION TAG, from a GitHub-hosted runner over OpenVPN + SSH
# (same pattern as deploy-monitoring.yml).
#
# Triggering (deploy is a versioned event, never a plain main push):
#   * runs AFTER "CD - Build, Push & Deploy" succeeds for a v* tag (workflow_run),
#     so the version-tagged images are already in GHCR before we pin them.
#   * workflow_dispatch with a `version` input deploys/rolls back to any existing
#     tag (e.g. v1.2.0) without rebuilding.
# A cd-deploy run that wasn't a v* tag (e.g. a manual build) is skipped here —
# dispatch this workflow with the version to roll it.
#
# Required secrets (already provisioned): VPN_OVPN, SSH_HOST, SSH_USER,
# SSH_PRIVATE_KEY. VM prerequisites (one-time): `ghcr-pull` imagePullSecret +
# `llm-secrets` in the pipeline namespace, and `make tf-apply` for the namespace
# + kafka-allow NetworkPolicy. See applications/pipeline/README.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to deploy (e.g. v1.3.0)'
        required: true
  workflow_run:
    workflows: ["CD - Build, Push & Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  SSH_OPTS: "-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
  OWNER: kayodevv
  # If the SSH user's default kubeconfig isn't the K3s one, set this to e.g.
  # /home/tisser_f/.kube/config (as deploy-monitoring.yml does).
  REMOTE_KUBECONFIG: ""

jobs:
  # Resolve the version to deploy: the dispatch input, or the tag that triggered
  # cd-deploy (workflow_run.head_branch is the tag name for a tag push). Deploy
  # only for a real v* version — a non-tag cd-deploy run is skipped.
  detect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$RUN_TAG"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if printf '%s' "$version" | grep -qE '^v[0-9]'; then
            echo "deploy -> version=$version"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "cd-deploy run was not a v* tag ('$version') -> skip"
            echo "(dispatch this workflow with a version input to deploy manually)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: ${{ needs.detect.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deploy the manifests AT the released tag, so manifests and images match.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.version }}

      - name: Install OpenVPN client
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Connect to OpenVPN
        run: |
          set -euo pipefail
          echo "${{ secrets.VPN_OVPN }}" > vpn.ovpn
          sudo openvpn --config vpn.ovpn --daemon --log vpn.log --writepid vpn.pid
          echo "Waiting for tun0..."
          timeout 60 bash -c 'until ip link show tun0 >/dev/null 2>&1; do sleep 2; done' \
            || { echo "::error::VPN tunnel did not come up"; sudo cat vpn.log; exit 1; }
          ip -br a show tun0

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Reachability check (SSH + K3s)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "${REMOTE_KUBECONFIG:+KUBECONFIG=$REMOTE_KUBECONFIG} kubectl get nodes -o wide"

      - name: Ship pipeline manifests to VM
        run: |
          set -euo pipefail
          tar czf - -C infrastructure/k8s-manifests/applications pipeline \
          | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -rf ~/charon-deploy/pipeline && mkdir -p ~/charon-deploy && tar xzf - -C ~/charon-deploy'

      - name: Apply pipeline (pin every service to the release version)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "OWNER=$OWNER VERSION='${{ needs.detect.outputs.version }}' KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/pipeline
            {
              echo ""
              echo "images:"
              for s in core-backend ml-layer verdict-layer llm-layer; do
                echo "  - name: ghcr.io/$OWNER/charon-$s"
                echo "    newTag: $VERSION"
              done
            } >> kustomization.yaml
            k apply -k .
            for s in core-backend ml-layer verdict-layer llm-layer; do
              k -n pipeline rollout status "deploy/$s" --timeout=180s
            done
            k -n pipeline get pods -o wide
          REMOTE

      - name: Ship sandbox manifests to VM
        run: |
          set -euo pipefail
          # Ship overlays/prod AND the base it references (../../applications/sandbox),
          # preserving the k8s-manifests layout so the relative path resolves.
          tar czf - -C infrastructure/k8s-manifests overlays/prod applications/sandbox \
          | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -rf ~/charon-deploy/km && mkdir -p ~/charon-deploy/km && tar xzf - -C ~/charon-deploy/km'

      - name: Apply sandbox (overlays/prod — in-cluster DNS + gVisor)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "OWNER=$OWNER VERSION='${{ needs.detect.outputs.version }}' KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/km
            # The consumer pulls from private GHCR but the sandbox ns may lack the
            # pull secret — clone it once from the pipeline ns (same registry creds).
            if ! k -n sandbox get secret ghcr-pull >/dev/null 2>&1; then
              k -n pipeline get secret ghcr-pull -o yaml \
                | grep -vE '^\s*(namespace|resourceVersion|uid|creationTimestamp):' \
                | k apply -n sandbox -f -
            fi
            # Apply the prod OVERLAY (base = ns-scoped consumer/secret/KEDA; overlay
            # wires in-cluster Kafka/MinIO DNS + gVisor). Pin the consumer to the
            # release version in the overlay's images: (replace its `[]` placeholder).
            grep -vE '^images:\s*\[\]\s*$' overlays/prod/kustomization.yaml > overlays/prod/kustomization.yaml.tmp
            mv overlays/prod/kustomization.yaml.tmp overlays/prod/kustomization.yaml
            {
              echo ""
              echo "images:"
              echo "  - name: ghcr.io/$OWNER/charon-sandbox-consumer"
              echo "    newTag: $VERSION"
            } >> overlays/prod/kustomization.yaml
            k apply -k overlays/prod
            k -n sandbox rollout status deploy/sandbox-consumer --timeout=180s
            # The consumer has no readiness probe, so "rolled out" can mask a pod
            # that Runs then crashes seconds later. Give it a moment and fail loud
            # if it's restarting.
            sleep 12
            rs=$(k -n sandbox get pods -l app=sandbox-consumer \
                   -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount}{"\n"}{end}' \
                 | sort -rn | head -1)
            if [ "${rs:-0}" -gt 0 ]; then
              echo "::error:: sandbox-consumer restarted ${rs}x after rollout — crashlooping"
              k -n sandbox logs deploy/sandbox-consumer --tail=40 || true
              exit 1
            fi
            k -n sandbox get pods -o wide
          REMOTE

      - name: Disconnect VPN
        if: always()
        run: sudo test -f vpn.pid && sudo kill "$(cat vpn.pid)" || true
