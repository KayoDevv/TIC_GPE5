name: Deploy core pipeline (OpenVPN + SSH)

# The `ref` input selects the commit, not an image version: the kustomizations
# and the Dockerfile headers in that commit decide what runs.
#
# VM prerequisites (one-time): `ghcr-pull` imagePullSecret + `llm-secrets` in the
# pipeline namespace, and `make tf-apply`. See applications/pipeline/README.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy from'
        required: false
        default: main
  workflow_run:
    workflows: ["CD - Release (promote to latest)"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  SSH_OPTS: "-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
  # On this node `kubectl` is the `k3s kubectl` wrapper, which reads
  # /etc/rancher/k3s/k3s.yaml (root, 0600) and ignores ~/.kube/config unless
  # KUBECONFIG is set — so the deploy user's own copy is only picked up when
  # this is non-empty. Single-quoted: $HOME must reach the node unexpanded and
  # be resolved there, not on the runner.
  REMOTE_KUBECONFIG: '$HOME/.kube/config'

jobs:
  # workflow_run.head_branch is the tag name when the trigger was a tag push.
  detect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - id: check
        env:
          DISPATCH_REF: ${{ github.event.inputs.ref }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref="${DISPATCH_REF:-main}"
          else
            ref="$RUN_TAG"
          fi
          if [ -z "$ref" ]; then
            echo "::error::could not resolve a ref to deploy"; exit 1
          fi
          echo "deploy from -> $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: ${{ needs.detect.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.ref }}

      # The manifests carry the image tags and nothing rewrites them at deploy
      # time, so a tag drifting from its Dockerfile header must stop the deploy.
      - name: Verify image tags match their Dockerfile headers
        run: python3 scripts/ci/check_image_versions.py

      - name: Install OpenVPN client
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Connect to OpenVPN
        run: |
          set -euo pipefail
          echo "${{ secrets.VPN_OVPN }}" > vpn.ovpn
          sudo openvpn --config vpn.ovpn --daemon --log vpn.log --writepid vpn.pid
          echo "Waiting for tun0..."
          timeout 60 bash -c 'until ip link show tun0 >/dev/null 2>&1; do sleep 2; done' \
            || { echo "::error::VPN tunnel did not come up"; sudo cat vpn.log; exit 1; }
          ip -br a show tun0

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Reachability check (SSH + K3s)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "${REMOTE_KUBECONFIG:+KUBECONFIG=$REMOTE_KUBECONFIG} kubectl get nodes -o wide"

      - name: Ship pipeline + website manifests to VM
        run: |
          set -euo pipefail
          tar czf - -C infrastructure/k8s-manifests/applications pipeline website \
          | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -rf ~/charon-deploy/pipeline ~/charon-deploy/website && mkdir -p ~/charon-deploy && tar xzf - -C ~/charon-deploy'

      - name: Apply pipeline (versions come from the kustomization)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/pipeline
            echo "--- versions from kustomization.yaml ---"
            grep -A1 '^  - name:' kustomization.yaml
            k apply -k .
            for s in core-backend ml-layer verdict-layer llm-layer; do
              k -n pipeline rollout status "deploy/$s" --timeout=180s
            done
            k -n pipeline get pods -o wide
          REMOTE

      - name: Apply website (static page + extension ZIP, Traefik ingress on :80)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/website
            k apply -k .
            k -n pipeline rollout status deploy/website --timeout=180s
          REMOTE

      - name: Ship sandbox manifests to VM
        run: |
          set -euo pipefail
          # The base and the components are shipped too, at their original depth,
          # or the overlay relative paths no longer resolve.
          tar czf - -C infrastructure/k8s-manifests overlays/prod applications/sandbox components \
          | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'rm -rf ~/charon-deploy/km && mkdir -p ~/charon-deploy/km && tar xzf - -C ~/charon-deploy/km'

      - name: Apply sandbox (overlays/prod — in-cluster DNS + gVisor)
        run: |
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "KC=$REMOTE_KUBECONFIG bash -seuo pipefail" <<'REMOTE'
            k() { KUBECONFIG=${KC:-$HOME/.kube/config} kubectl "$@"; }
            cd ~/charon-deploy/km
            # Same registry creds as the pipeline ns; clone rather than duplicate.
            if ! k -n sandbox get secret ghcr-pull >/dev/null 2>&1; then
              k -n pipeline get secret ghcr-pull -o yaml \
                | grep -vE '^\s*(namespace|resourceVersion|uid|creationTimestamp):' \
                | k apply -n sandbox -f -
            fi
            k apply -k overlays/prod
            k -n sandbox rollout status deploy/sandbox-consumer --timeout=180s
            # No readiness probe, so "rolled out" can mask a pod that crashes
            # seconds later.
            sleep 12
            rs=$(k -n sandbox get pods -l app=sandbox-consumer \
                   -o jsonpath='{range .items[*]}{.status.containerStatuses[0].restartCount}{"\n"}{end}' \
                 | sort -rn | head -1)
            if [ "${rs:-0}" -gt 0 ]; then
              echo "::error:: sandbox-consumer restarted ${rs}x after rollout — crashlooping"
              k -n sandbox logs deploy/sandbox-consumer --tail=40 || true
              exit 1
            fi
            k -n sandbox get pods -o wide
          REMOTE

      - name: Disconnect VPN
        if: always()
        run: sudo test -f vpn.pid && sudo kill "$(cat vpn.pid)" || true
