name: Import sandbox agent images (build -> ctr import)

# Rebuilds the detonation agent images (ubuntu-sandbox:v1 + ubuntu-pdf-sandbox:v1)
# on the runner and imports them into GPE-NYX's k3s containerd over OpenVPN + SSH.
#
# Why not the normal GHCR pull path: detonation Jobs run CREDENTIAL-LESS
# (automount_service_account_token=false, no imagePullSecrets) so a live sample
# can't reach GHCR. The agent images are therefore import-model (IfNotPresent,
# :v1), loaded straight into containerd — this is the automation of
# `make import-images`, minus the on-node hand-build.
#
# The `:v1` tag is updated in place; the NEXT detonation Job (new pod) picks up
# the refreshed image automatically — no rollout needed.
#
# Manual only. Required secrets: VPN_OVPN, SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: import-sandbox-agents
  cancel-in-progress: false

env:
  SSH_OPTS: "-i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
  AGENT_IMAGE: "ghcr.io/kayodevv/ubuntu-sandbox:v1"
  PDF_IMAGE: "ghcr.io/kayodevv/ubuntu-pdf-sandbox:v1"

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the already-built current images from GHCR and retag to :v1 (the tag
      # the credential-less detonation Jobs reference). Avoids rebuilding — the
      # pdf-agent Dockerfile downloads mupdf from mupdf.com at build time, which
      # is slow/flaky on a cold runner.
      - name: Pull current agent images + retag :v1
        run: |
          set -euo pipefail
          docker pull ghcr.io/kayodevv/ubuntu-sandbox:latest
          docker pull ghcr.io/kayodevv/ubuntu-pdf-sandbox:latest
          docker tag ghcr.io/kayodevv/ubuntu-sandbox:latest "$AGENT_IMAGE"
          docker tag ghcr.io/kayodevv/ubuntu-pdf-sandbox:latest "$PDF_IMAGE"
          docker image ls | grep ubuntu-

      - name: Install OpenVPN client
        run: sudo apt-get update && sudo apt-get install -y openvpn

      - name: Connect to OpenVPN
        run: |
          set -euo pipefail
          echo "${{ secrets.VPN_OVPN }}" > vpn.ovpn
          sudo openvpn --config vpn.ovpn --daemon --log vpn.log --writepid vpn.pid
          echo "Waiting for tun0..."
          timeout 60 bash -c 'until ip link show tun0 >/dev/null 2>&1; do sleep 2; done' \
            || { echo "::error::VPN tunnel did not come up"; sudo cat vpn.log; exit 1; }
          ip -br a show tun0

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Preflight (SSH + passwordless sudo for ctr)
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'sudo -n k3s ctr images ls >/dev/null 2>&1' \
            || { echo "::error::The SSH user lacks passwordless sudo for 'k3s ctr'. Run 'make import-images' on the node manually, or grant NOPASSWD for k3s."; exit 1; }
          echo "sudo/ctr OK"

      - name: Ship + import into k3s containerd
        run: |
          set -euo pipefail
          for img in "$AGENT_IMAGE" "$PDF_IMAGE"; do
            echo "==> importing $img"
            docker save "$img" \
            | ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                'sudo -n k3s ctr images import -'
          done
          echo "--- agent images now in k3s ---"
          ssh $SSH_OPTS "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'sudo -n k3s ctr images ls | grep -E "ubuntu-(sandbox|pdf-sandbox):v1" || true'

      - name: Disconnect VPN
        if: always()
        run: sudo test -f vpn.pid && sudo kill "$(cat vpn.pid)" || true
