name: CI — Build Docker Images

# Verification-only build on every PR to main.
# Goal: confirm every Dockerfile compiles cleanly and has no CRITICAL/HIGH CVEs
# before merge. Nothing is pushed — the actual push happens in cd-deploy.yml.
#
# The service matrix lives in .github/service-matrix.json — single source of
# truth shared with cd-deploy.yml, so the two workflows never diverge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists changed files via the PR API

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which services a PR touches (see .github/filters.yml). Only those get
  # built/scanned; a PR that touches nothing buildable builds nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

  load-matrix:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      has: ${{ steps.read.outputs.has }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        # Intersect the full service matrix with the changed filter names.
        env:
          CHANGED: ${{ needs.changes.outputs.services }}
        run: |
          M=$(jq -c --argjson ch "$CHANGED" \
            '{include: [.include[] | select(.name as $n | $ch | index($n))]}' \
            .github/service-matrix.json)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "has=$(echo "$M" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo "$M" | jq -c '[.include[].name]')"

  build:
    if: ${{ needs.load-matrix.outputs.has == 'true' }}
    name: Build · ${{ matrix.name }}
    needs: load-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile not found at ${{ matrix.dockerfile }} — skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      # Build with load:true so Trivy can scan the image before we approve merge.
      - name: Build image (local, pre-scan)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: charon/${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Block merge on any CRITICAL or HIGH CVE with a fix available.
      - name: Scan image for CVEs (Trivy)
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: charon/${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

  # Single stable status for branch protection. Because `build` is a scoped
  # matrix (it produces no check contexts when nothing relevant changed),
  # require THIS job in the branch ruleset instead of the per-service builds —
  # otherwise a PR that touches no service would wait forever on a check that
  # never runs. Passes when builds succeeded or were legitimately skipped.
  build-result:
    name: Build result
    if: ${{ always() }}
    needs: [changes, load-matrix, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.load-matrix.result }}" "${{ needs.build.result }}"; do
            echo "upstream result: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required build job failed"
              exit 1
            fi
          done
          echo "All builds passed or were skipped."
