name: CD - Release (promote to latest)

# Moves `latest` onto the version each Dockerfile header declares, by manifest
# copy: `latest` is byte-identical to the version it points at. Images are built
# by cd-publish-images.yml, never here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  OWNER: kayodevv     # forced lowercase — github.repository_owner = "KayoDevv"

jobs:
  promote:
    name: Promote header versions to latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Checked up front so `latest` is never half-promoted across services.
      - name: Check every header version is on GHCR
        run: |
          set -euo pipefail
          missing=0
          while read -r image dockerfile; do
            if [ ! -f "$dockerfile" ]; then
              echo "  ~ $image: no Dockerfile — skipped"
              continue
            fi
            ref=$(sed -n 's|^#[[:space:]]*ghcr-image:[[:space:]]*\([^[:space:]]*\).*|\1|p' "$dockerfile" | head -1)
            version=${ref##*:}
            if [ -z "$ref" ] || [ "$ref" = "$version" ]; then
              echo "::error file=$dockerfile::no '# ghcr-image: <name>:<version>' header"
              missing=$((missing+1)); continue
            fi
            if docker manifest inspect "ghcr.io/$OWNER/$image:$version" >/dev/null 2>&1; then
              echo "  OK  $image:$version"
            else
              echo "::error::$image:$version is not on GHCR — run 'CD - Publish images' first"
              missing=$((missing+1))
            fi
          done < <(jq -r '.include[] | "\(.image) \(.dockerfile)"' .github/service-matrix.json)

          [ "$missing" = "0" ] || { echo "$missing image(s) missing — nothing promoted"; exit 1; }

      - name: Move latest onto each header version
        run: |
          set -euo pipefail
          while read -r image dockerfile; do
            [ -f "$dockerfile" ] || continue
            ref=$(sed -n 's|^#[[:space:]]*ghcr-image:[[:space:]]*\([^[:space:]]*\).*|\1|p' "$dockerfile" | head -1)
            version=${ref##*:}
            echo "  $image: latest -> $version"
            docker buildx imagetools create -t "ghcr.io/$OWNER/$image:latest" "ghcr.io/$OWNER/$image:$version"
          done < <(jq -r '.include[] | "\(.image) \(.dockerfile)"' .github/service-matrix.json)

      - name: Verify latest matches the version it was promoted from
        run: |
          set -euo pipefail
          while read -r image dockerfile; do
            [ -f "$dockerfile" ] || continue
            ref=$(sed -n 's|^#[[:space:]]*ghcr-image:[[:space:]]*\([^[:space:]]*\).*|\1|p' "$dockerfile" | head -1)
            version=${ref##*:}
            a=$(docker buildx imagetools inspect "ghcr.io/$OWNER/$image:$version" --format '{{.Manifest.Digest}}')
            b=$(docker buildx imagetools inspect "ghcr.io/$OWNER/$image:latest"   --format '{{.Manifest.Digest}}')
            if [ "$a" = "$b" ]; then
              echo "  OK  $image:latest = $version  $a"
            else
              echo "::error::$image: latest ($b) differs from $version ($a)"; exit 1
            fi
          done < <(jq -r '.include[] | "\(.image) \(.dockerfile)"' .github/service-matrix.json)

      - name: Summary
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Release $REF_NAME — latest now points at each Dockerfile header version."
          echo "deploy-pipeline.yml will roll this commit onto GPE-NYX."
