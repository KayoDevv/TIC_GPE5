      #     cd infrastructure/k8s-manifests/overlays/prod
      #     kustomize edit set image \
      #       ghcr.io/${{ env.OWNER }}/charon-sandbox-consumer=ghcr.io/${{ env.OWNER }}/charon-sandbox-consumer:${TAG} \
      #       ghcr.io/${{ env.OWNER }}/charon-minio-watcher=ghcr.io/${{ env.OWNER }}/charon-minio-watcher:${TAG}
