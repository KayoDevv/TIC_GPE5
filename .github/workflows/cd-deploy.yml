name: CD - Build, Push & Deploy

# Build + Trivy-scan + push EVERY service image to GHCR on a VERSION TAG
# (git tag v*), tagged with that version; deploy-pipeline.yml then rolls them
# onto GPE-NYX. Plain main pushes build/deploy NOTHING — a release is a
# deliberate, versioned event (and dependabot bumps, which never tag, no longer
# trigger any build/deploy).
#
#   Release: git tag v1.3.0 && git push origin v1.3.0
#   Manual:  workflow_dispatch with the `tag` input (e.g. v1.3.0-hotfix)
#
# Registry: ghcr.io via GITHUB_TOKEN. Image names come from service-matrix.json.
# OWNER is lowercased (OCI refs must be lowercase; the repo owner has a capital).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build (e.g. v1.3.0)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  OWNER: kayodevv     # forced lowercase — github.repository_owner = "KayoDevv"

jobs:
  # A version tag releases the whole matrix at that version — no change-scoping
  # (diffing a tag against its parent isn't the "what shipped in this release").
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          M=$(jq -c '{include: .include}' .github/service-matrix.json)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "Releasing: $(echo "$M" | jq -c '[.include[].name]')"

  build-and-push:
    name: Build & Push · ${{ matrix.name }}
    needs: load-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile at ${{ matrix.dockerfile }} — skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          # tag push -> the tag name (v1.3.0); manual dispatch -> the input tag.
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      # Build locally first so Trivy can scan before anything is published.
      - name: Build image (local, pre-scan)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: charon/${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Block the push on any CRITICAL or HIGH CVE with a fix available.
      - name: Scan image for CVEs (Trivy)
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: charon/${{ matrix.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # Push only after a clean scan. Layer cache makes this fast.
      - name: Push image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # deploy-pipeline.yml runs on this workflow's success (OpenVPN + SSH into
  # GPE-NYX) and rolls the just-pushed version tag onto the cluster.
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    steps:
      - name: Note released images
        run: |
          echo "Released ghcr.io/${{ env.OWNER }}/charon-* at ${{ github.ref_name }}"
          echo "deploy-pipeline.yml will roll this version onto GPE-NYX."
