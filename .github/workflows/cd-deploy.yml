name: CD - Build, Push & Deploy

# Triggered when a PR is merged into main (or manually via workflow_dispatch).
# Flow: build Docker images → Trivy CVE scan → push to ghcr.io → deploy (stub).
#
# Registry: ghcr.io (GitHub Container Registry) using GITHUB_TOKEN — no extra
# secrets needed. Image names are derived from .github/service-matrix.json.
# OWNER is forced lowercase because the GitHub repo name has an uppercase letter
# and OCI image references must be lowercase.
#
# Tagging: sha- + latest on every merge (rebuild-on-merge). The archived
# version-tagged images (publish-images.yml) have been consolidated here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deploy at a time. If a second push lands while a deploy is running,
# it queues — never cancels — to avoid leaving the cluster in a partial state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  OWNER: kayodevv     # forced lowercase — github.repository_owner = "KayoDevv"

jobs:
  # ── Detect which services changed (scope the build like ci-build) ──────────
  changes:
    runs-on: ubuntu-latest
    # Skip build/push (and the deploy that chains off it) for Dependabot bumps:
    # they're already validated on the PR by ci-build/ci-tests, so rebuilding the
    # image and rolling the cluster on every bump merge just burns Actions minutes.
    # Manual dispatch always runs. Prefixes come from .github/dependabot.yml.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (!startsWith(github.event.head_commit.message, 'chore(deps') &&
           !startsWith(github.event.head_commit.message, 'ci(deps')) }}
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/filters.yml

  # ── Load shared service matrix, filtered to the changed services ───────────
  load-matrix:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      has: ${{ steps.read.outputs.has }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          CHANGED: ${{ needs.changes.outputs.services }}
        run: |
          M=$(jq -c --argjson ch "$CHANGED" \
            '{include: [.include[] | select(.name as $n | $ch | index($n))]}' \
            .github/service-matrix.json)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "has=$(echo "$M" | jq '.include | length > 0')" >> "$GITHUB_OUTPUT"
          echo "Building+pushing: $(echo "$M" | jq -c '[.include[].name]')"

  # ── Build & push images ────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push · ${{ matrix.name }}
    needs: load-matrix
    if: ${{ needs.load-matrix.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile at ${{ matrix.dockerfile }} — skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # Build locally first so Trivy can scan before anything is published.
      - name: Build image (local, pre-scan)
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: charon/${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Block the push on any CRITICAL or HIGH CVE with a fix available.
      - name: Scan image for CVEs (Trivy)
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: charon/${{ matrix.name }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # Push only after a clean scan. Layer cache makes this fast.
      - name: Push image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ── Summary ─────────────────────────────────────────────────────────────────
  # The cluster apply is a SEPARATE workflow: deploy-pipeline.yml runs on this
  # workflow's success (OpenVPN + SSH into GPE-NYX, pull the just-pushed images
  # from GHCR). GPE-NYX is a private VM but IS reachable from a hosted runner via
  # the OpenVPN pattern (secrets VPN_OVPN / SSH_* — see deploy-monitoring.yml).
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ always() && needs.build-and-push.result == 'success' }}
    steps:
      - name: Note pushed images
        run: |
          echo "Images pushed to ghcr.io/${{ env.OWNER }} — SHA ${{ github.sha }}"
          echo "deploy-pipeline.yml will apply them over OpenVPN+SSH."
