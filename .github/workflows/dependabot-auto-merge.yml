name: Dependabot auto-merge

# Enables GitHub's native auto-merge on low-risk Dependabot PRs (patch + minor).
# The PR still merges ONLY once all required status checks pass — so the scoped
# CI (Build/Tests/Lint result gates) remains the safety net. Major bumps are left
# for a human to review.
#
# Prerequisites (one-time, in repo settings — cannot be set from a workflow):
#   1. Settings → General → Pull Requests → enable "Allow auto-merge".
#   2. Ruleset "main-protection" → require the gate checks
#      (Build result / Tests result / Lint result). Without required checks,
#      auto-merge would merge before CI finishes.
#   3. If the ruleset requires human approval, either exempt Dependabot or enable
#      "Allow GitHub Actions to create and approve pull requests" and add an
#      approve step — otherwise these PRs will wait for a review that never comes.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch & minor updates
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
              steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
