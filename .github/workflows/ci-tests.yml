name: CI — Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists changed files via the PR API

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Each suite runs only when its sources change (see .github/filters.yml).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test-core: ${{ steps.filter.outputs.test-core }}
      test-ml-layer: ${{ steps.filter.outputs.test-ml-layer }}
      test-core-backend: ${{ steps.filter.outputs.test-core-backend }}
      test-verdict-layer: ${{ steps.filter.outputs.test-verdict-layer }}
      test-llm-layer: ${{ steps.filter.outputs.test-llm-layer }}
      test-sandbox-layer: ${{ steps.filter.outputs.test-sandbox-layer }}
      test-frontend: ${{ steps.filter.outputs.test-frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

  # ────────────────────────────────────────────────────────────────────────────
  # packages/core — Pydantic event models + Kafka producer/consumer
  # ────────────────────────────────────────────────────────────────────────────
  test-core:
    needs: changes
    if: ${{ needs.changes.outputs.test-core == 'true' }}
    name: Test · packages/core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python + Poetry
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"
          working-directory: packages/core

      - name: Ruff lint
        working-directory: packages/core
        run: poetry run ruff check .

      - name: MyPy strict type check
        working-directory: packages/core
        run: poetry run mypy src/

      - name: pytest — 100 % coverage enforced (fail_under set in pyproject.toml)
        working-directory: packages/core
        run: poetry run pytest --cov --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # apps/workers/ml_layer — static PDF analysis (LightGBM / ONNX Runtime)
  # ────────────────────────────────────────────────────────────────────────────
  test-ml-layer:
    needs: changes
    if: ${{ needs.changes.outputs.test-ml-layer == 'true' }}
    name: Test · apps/workers/ml_layer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python + Poetry
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"
          working-directory: apps/workers/ml_layer

      - name: Ruff lint
        working-directory: apps/workers/ml_layer
        run: poetry run ruff check .

      - name: MyPy strict type check
        working-directory: apps/workers/ml_layer
        run: poetry run mypy src/

      - name: pytest — 100 % coverage enforced (fail_under set in pyproject.toml)
        working-directory: apps/workers/ml_layer
        run: poetry run pytest --cov --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # apps/workers/sandbox_layer — behavioural analysis engine (pure core only)
  # ────────────────────────────────────────────────────────────────────────────
  # Pure core only (golden + hypothesis unit tests): no subprocess, I/O, K8s or strace
  # — the imperative shell is validated on the VM via `make sandbox-validate`.
  # aiokafka is still required: run_analysis.py imports AIOKafkaProducer at module level.
  test-sandbox-layer:
    needs: changes
    if: ${{ needs.changes.outputs.test-sandbox-layer == 'true' }}
    name: Test · apps/workers/sandbox_layer (pure core)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-sandbox-${{ runner.os }}-${{ hashFiles('apps/workers/sandbox_layer/**/*.py') }}
          restore-keys: pip-sandbox-${{ runner.os }}-

      - name: Install test dependencies
        run: |
          # Pinned to the versions the other packages lock in poetry.lock: this
          # job has no lock file, so an unpinned tool silently changes the gate.
          pip install --quiet \
            "pydantic==2.7.1" \
            "aiokafka==0.10.0" \
            "pytest==8.4.2" \
            "pytest-cov==7.1.0" \
            "ruff==0.15.20"

      - name: Ruff lint — pure core modules (hypotheses / scoring / report / models)
        run: |
          ruff check \
            apps/workers/sandbox_layer/agent/core/ \
            apps/workers/sandbox_layer/agent/hypotheses/ \
            apps/workers/sandbox_layer/agent/models/

      # PYTHONPATH allows `from hypotheses._types import ...` etc.
      # (mirrors the sys.path.insert done by test_golden_core.py itself)
      - name: pytest — golden + unit (pure core)
        env:
          PYTHONPATH: apps/workers/sandbox_layer/agent
        run: |
          pytest apps/workers/sandbox_layer/agent/tests/ \
            -v --tb=short \
            --cov=apps/workers/sandbox_layer/agent/core \
            --cov=apps/workers/sandbox_layer/agent/hypotheses \
            --cov=apps/workers/sandbox_layer/agent/models \
            --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # apps/core-backend — FastAPI API Gateway
  # ────────────────────────────────────────────────────────────────────────────
  test-core-backend:
    needs: changes
    if: ${{ needs.changes.outputs.test-core-backend == 'true' }}
    name: Test · apps/core-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python + Poetry
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"
          working-directory: apps/core-backend

      - name: Ruff lint
        working-directory: apps/core-backend
        run: poetry run ruff check .

      - name: MyPy strict type check
        working-directory: apps/core-backend
        run: poetry run mypy src/

      - name: pytest — 100 % coverage enforced
        working-directory: apps/core-backend
        run: poetry run pytest --cov --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # apps/workers/verdict_layer — Saga / decision matrix (Redis state, no I/O tests)
  # ────────────────────────────────────────────────────────────────────────────
  test-verdict-layer:
    needs: changes
    if: ${{ needs.changes.outputs.test-verdict-layer == 'true' }}
    name: Test · apps/workers/verdict_layer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python + Poetry
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"
          working-directory: apps/workers/verdict_layer
      - name: Ruff lint
        working-directory: apps/workers/verdict_layer
        run: poetry run ruff check .
      - name: MyPy strict type check
        working-directory: apps/workers/verdict_layer
        run: poetry run mypy src/
      - name: pytest — 100 % coverage enforced (fail_under set in pyproject.toml)
        working-directory: apps/workers/verdict_layer
        run: poetry run pytest --cov --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # apps/workers/llm_layer — semantic analysis pipeline (HF/vLLM client mocked)
  # ────────────────────────────────────────────────────────────────────────────
  test-llm-layer:
    needs: changes
    if: ${{ needs.changes.outputs.test-llm-layer == 'true' }}
    name: Test · apps/workers/llm_layer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python + Poetry
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"
          working-directory: apps/workers/llm_layer
      - name: Ruff lint
        working-directory: apps/workers/llm_layer
        run: poetry run ruff check .
      - name: MyPy strict type check
        working-directory: apps/workers/llm_layer
        run: poetry run mypy src/
      - name: pytest — 100 % coverage enforced (fail_under set in pyproject.toml)
        working-directory: apps/workers/llm_layer
        run: poetry run pytest --cov --cov-report=term-missing

  # ────────────────────────────────────────────────────────────────────────────
  # apps/frontend — Vue 3 + WXT extension (Vitest unit tests + vue-tsc typecheck)
  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.test-frontend == 'true' }}
    name: Test · apps/frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"   # listr2 (via wxt) requires node >= 22.13
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Generate WXT types
        # wxt prepare generates .wxt/ type declarations (incl. import.meta.env);
        # without it vue-tsc fails on a fresh checkout (TS2339).
        working-directory: apps/frontend
        run: npx wxt prepare
      - name: Typecheck (vue-tsc)
        working-directory: apps/frontend
        run: npm run typecheck
      - name: Unit tests (Vitest)
        working-directory: apps/frontend
        run: npm run test:unit

  # Single stable status for branch protection — require THIS instead of the
  # per-suite jobs, which are scoped and may be skipped. Passes when every suite
  # succeeded or was legitimately skipped.
  tests-result:
    name: Tests result
    if: ${{ always() }}
    needs:
      - changes
      - test-core
      - test-ml-layer
      - test-core-backend
      - test-verdict-layer
      - test-llm-layer
      - test-sandbox-layer
      - test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if any test suite failed
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.test-core.result }}" \
                   "${{ needs.test-ml-layer.result }}" "${{ needs.test-core-backend.result }}" \
                   "${{ needs.test-verdict-layer.result }}" "${{ needs.test-llm-layer.result }}" \
                   "${{ needs.test-sandbox-layer.result }}" "${{ needs.test-frontend.result }}"; do
            echo "suite result: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required test suite failed"
              exit 1
            fi
          done
          echo "All test suites passed or were skipped."
