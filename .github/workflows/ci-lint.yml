name: CI - Lint YAML, Kubernetes, Docker, Terraform

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists changed files via the PR API

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each linter runs only when files it cares about change (see .github/filters.yml).
  # A PR that touches none of them (e.g. Python-only or docs-only) runs no linter.
  changes:
    runs-on: ubuntu-latest
    outputs:
      yaml: ${{ steps.filter.outputs.lint-yaml }}
      k8s: ${{ steps.filter.outputs.lint-k8s }}
      docker: ${{ steps.filter.outputs.lint-docker }}
      compose: ${{ steps.filter.outputs.lint-compose }}
      terraform: ${{ steps.filter.outputs.lint-terraform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yml

  yaml-lint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml == 'true' }}
    name: YAML Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          FILES=$(find . \( -name '*.yaml' -o -name '*.yml' \) | grep -v '.github/' || true)
          if [ -z "$FILES" ]; then
            echo "No YAML files found, skipping"
            exit 0
          fi
          echo "$FILES" | xargs yamllint -c .yamllint.yml

  kube-validate:
    needs: changes
    if: ${{ needs.changes.outputs.k8s == 'true' }}
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
          sudo tar xz -C /usr/local/bin

      - name: Validate K8s manifests
        run: |
          # Direct validation of the standalone manifests (base/applications).
          # overlays/ and *-patch.yaml are kustomize strategic merge patches, not
          # valid manifests on their own — we exclude them here and validate
          # them via kustomize build in the next step.
          FILES=$(find infrastructure \( -name '*.yaml' -o -name '*.yml' \) \
            | grep -v 'terraform/' \
            | grep -v 'scripts/' \
            | grep -v 'overlays/' \
            | grep -v -- '-patch.yaml' \
            | grep -v 'kustomization.yaml' \
            | grep -vE 'values(-[a-z]+)?\.yaml' \
            || true)
          if [ -z "$FILES" ]; then
            echo "No K8s manifests found, skipping validation"
            exit 0
          fi
          echo "$FILES" | xargs kubeconform \
            -strict -verbose -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Validate kustomize overlays render correctly
        run: |
          # Checks that the overlays produce valid manifests after the kustomize
          # render. This is what is actually applied via kubectl apply -k. No
          # kustomize patch is validated standalone.
          for overlay in infrastructure/k8s-manifests/overlays/*/; do
            if [ -f "$overlay/kustomization.yaml" ]; then
              echo "Rendering and validating: $overlay"
              kubectl kustomize "$overlay" | kubeconform \
                -strict -verbose -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            fi
          done

  dockerfile-lint:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
          -o /usr/local/bin/hadolint && sudo chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles
        run: |
          FILES=$(find . -name 'Dockerfile*')
          if [ -z "$FILES" ]; then
            echo "No Dockerfiles found, skipping"
            exit 0
          fi
          while IFS= read -r f; do
            echo "Linting $f"
            hadolint "$f"
          done <<< "$FILES"

  docker-compose-validate:
    needs: changes
    if: ${{ needs.changes.outputs.compose == 'true' }}
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate docker-compose
        run: |
          FILES=$(find . \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' \))
          if [ -z "$FILES" ]; then
            echo "No docker-compose files found, skipping"
            exit 0
          fi
          while IFS= read -r f; do
            echo "Validating $f"
            docker compose -f "$f" config --quiet
          done <<< "$FILES"

  terraform-validate:
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Initialize Terraform
        run: |
          init_succeeded=false
          for i in 1 2 3; do
            if terraform -chdir=infrastructure/terraform init -backend=false; then
              init_succeeded=true
              break
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$init_succeeded" != "true" ]; then
            echo "Terraform initialization failed after 3 attempts."
            exit 1
          fi

      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform validate

  # Single stable status for branch protection — the individual linters are
  # scoped and may be skipped. Passes when every linter succeeded or was skipped.
  lint-result:
    name: Lint result
    if: ${{ always() }}
    needs: [changes, yaml-lint, kube-validate, dockerfile-lint, docker-compose-validate, terraform-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any linter failed
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.yaml-lint.result }}" \
                   "${{ needs.kube-validate.result }}" "${{ needs.dockerfile-lint.result }}" \
                   "${{ needs.docker-compose-validate.result }}" "${{ needs.terraform-validate.result }}"; do
            echo "linter result: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required linter failed"
              exit 1
            fi
          done
          echo "All linters passed or were skipped."
