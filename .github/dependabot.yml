version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, ci]

  # ── Python — packages/core ──────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /packages/core
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, python]

  # ── Python — apps/workers/ml_layer ─────────────────────────────────────────
  - package-ecosystem: pip
    directory: /apps/workers/ml_layer
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, python]

  # ── Docker — sandbox images ─────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /apps/workers/sandbox_layer
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]

  # ── Docker — minio watcher ──────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /apps/workers/minio_watcher
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies, docker]
