apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: charon-alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes", "nodes/proxy", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: charon-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: charon-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    // One stable `service` label across apps, workers and deps: prefer the pod's
    // `app` label, else app.kubernetes.io/name (Bitnami/Helm deps). job_id stays
    // IN the line (queried with `| json | job_id="..."`) — never a label, to keep
    // stream cardinality low.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "(.+)"
        target_label  = "service"
      }
      // Detonation Jobs carry no `app` label (only charon.io/role=analysis), so
      // they'd land with an empty service and be invisible in the dashboard.
      // Label them explicitly so the actual sandbox analysis is first-class.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_charon_io_role"]
        regex         = "analysis"
        target_label  = "service"
        replacement   = "sandbox-detonation"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.default.receiver]
    }

    // Kubernetes Events are not container output: a pod that never starts (ErrImageNeverPull,
    // quota refusal, deadline) leaves no log, only events, which the API server drops after
    // ~1 h. Query them in Grafana with {job="kubernetes-events"}.
    // ponytail: every Alloy pod of the DaemonSet tails all events; fine on the single node,
    // move this to one Deployment replica before adding nodes or events get duplicated.
    loki.source.kubernetes_events "cluster" {
      job_name   = "kubernetes-events"
      log_format = "logfmt"
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.charon.internal:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        fsGroup: 473
      containers:
        - name: alloy
          image: grafana/alloy:v1.4.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - {containerPort: 12345, name: http}
          resources:
            requests: {cpu: "30m", memory: "96Mi"}
            limits: {cpu: "300m", memory: "256Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
            - {name: storage, mountPath: /tmp/alloy}
      volumes:
        - name: config
          configMap: {name: alloy-config}
        - name: storage
          emptyDir: {}
