# Dev overlay — native K3s (GPE-NYX) with Bitnami Kafka + MinIO StatefulSet
# in-cluster. NetworkPolicies enforced via Calico (calico-system).
#
# Same base and endpoints as prod, plus the host-side MinIO NodePort the
# validator/feeder needs. Deployment: make deploy-dev (chains import-images).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../applications/sandbox

components:
  - ../../components/in-cluster-endpoints
  - ../../components/dev-nodeports
