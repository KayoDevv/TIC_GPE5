# Patch dev — branche le consumer sur Kafka (Bitnami) + MinIO (StatefulSet)
# in-cluster via le DNS K8s. Override K8S_API_SERVER pour qu'il pointe sur
# le service `kubernetes` au lieu de NODE_IP:6443 (le pod ne peut pas joindre
# le port 6443 du host avec kube-router enforcé).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-consumer
spec:
  template:
    spec:
      containers:
        - name: consumer
          env:
            # Override K8S_API_SERVER : la base utilise NODE_IP:6443 (fallback
            # legacy). On force le service in-cluster pour passer NetworkPolicy.
            - name: K8S_API_SERVER
              value: "https://kubernetes.default.svc:443"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: AGENT_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: AGENT_MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
