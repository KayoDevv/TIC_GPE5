# Prod overlay — in-cluster Kafka/MinIO DNS, no host exposure (ClusterIP only).
# Differs from dev by the dev-nodeports component, which prod does not pull in.
#
# The namespace comes from the sandbox base; setting it here too would rewrite
# the namespace of any component resource that lives elsewhere.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../applications/sandbox

components:
  - ../../components/in-cluster-endpoints
