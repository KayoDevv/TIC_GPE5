# Differs from the dev overlay only by consumer-env-patch.yaml (in-cluster
# Kafka/MinIO DNS). The consumer version is inherited from the base.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandbox

resources:
  - ../../applications/sandbox

patches:
  - path: consumer-env-patch.yaml
    target:
      kind: Deployment
      name: sandbox-consumer
