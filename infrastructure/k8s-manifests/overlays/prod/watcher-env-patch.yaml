# Prod patch — wires the minio-watcher to in-cluster Kafka + MinIO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-watcher
spec:
  template:
    spec:
      containers:
        - name: watcher
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: MINIO_PRESIGN_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
