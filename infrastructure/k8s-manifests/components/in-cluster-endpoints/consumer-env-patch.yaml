# Wires the consumer to Kafka (Bitnami) + MinIO (StatefulSet)
# in-cluster via K8s DNS. Overrides K8S_API_SERVER so it points to the
# `kubernetes` service instead of NODE_IP:6443 (the pod cannot reach the
# host's port 6443 with the Calico NetworkPolicy enforced).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-consumer
spec:
  template:
    spec:
      containers:
        - name: consumer
          env:
            # Override K8S_API_SERVER: the base uses NODE_IP:6443 (legacy
            # fallback). We force the in-cluster service to pass NetworkPolicy.
            - name: K8S_API_SERVER
              value: "https://kubernetes.default.svc:443"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: AGENT_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: AGENT_MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            # Kernel isolation for detonation Jobs: gVisor (runsc) is mandatory.
            # The consumer passes this runtimeClassName to every detonation Job.
            # Validated on GPE-NYX (no KVM → Kata impossible; gVisor + strace OK).
            - name: SANDBOX_RUNTIME_CLASS
              value: "gvisor"
