# DEV-ONLY NodePort so the host validator/feeder can upload samples. Separate from
# the ClusterIP base `minio` Service; applied by `make dev-expose`, removed by teardown.
apiVersion: v1
kind: Service
metadata:
  name: minio-ext
  namespace: minio
  labels:
    app: minio
    charon.io/env: dev
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: 32090
      protocol: TCP
