# Kafka consumer — analysis Job dispatcher.
# Does NOT analyze locally: it consumes file.requested and creates 1 Job
# per sample. Lightweight: 100m CPU, 128Mi RAM. Scaled by KEDA on Kafka lag.
#
# Endpoints: the base env vars define the fallbacks. The dev and prod overlays
# (components/in-cluster-endpoints) inject the in-cluster DNS:
#   - kafka.kafka.svc.cluster.local:9092
#   - minio.minio.svc.cluster.local:9000
#   - kubernetes.default.svc:443 (K8s API for Job creation)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-consumer
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox-consumer
    app.kubernetes.io/part-of: charon
spec:
  replicas: 1            # KEDA takes over via ScaledObject (1..3)
  selector:
    matchLabels:
      app: sandbox-consumer
  template:
    metadata:
      labels:
        app: sandbox-consumer
    spec:
      serviceAccountName: sandbox-consumer
      # The consumer image is pulled from private GHCR, so it needs the pull
      # secret — unlike the agent images, which stay on the import model since
      # detonation Jobs run with no pull secret. The deploy clones ghcr-pull
      # from the pipeline ns if it's missing here.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: consumer
          image: ghcr.io/kayodevv/charon-sandbox-consumer
          imagePullPolicy: IfNotPresent
          env:
            # IP of the node where this pod runs — injected dynamically by K8s.
            # Must come first so the other env vars can use it via $(NODE_IP).
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: K8S_API_SERVER
              value: "https://$(NODE_IP):6443"
            # Endpoints of the services running on the host (docker-compose dev).
            # Overridden by the in-cluster-endpoints component (dev + prod overlays).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "$(NODE_IP):9093"
            - name: AGENT_KAFKA_BOOTSTRAP_SERVERS
              value: "$(NODE_IP):9093"
            - name: MINIO_ENDPOINT
              value: "$(NODE_IP):9000"
            - name: AGENT_MINIO_ENDPOINT
              value: "$(NODE_IP):9000"
            # Presign endpoint: the host signed here must equal the detonation
            # agent's ALLOWED_DOWNLOAD_HOSTS (in-cluster DNS name, NOT a node IP)
            # so the pod's SSRF guard accepts the URL and its sinkhole hostAlias
            # can pin it to MinIO's ClusterIP.
            - name: MINIO_PRESIGN_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-s3
                  key: ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-s3
                  key: SECRET_KEY
            # Constants — not dependent on the host IP.
            - name: KAFKA_TOPIC_IN
              value: "file.requested"
            - name: KAFKA_TOPIC_OUT
              value: "sandbox_layer.result"
            - name: KAFKA_GROUP_ID
              value: "charon-sandbox-v1"
            - name: K8S_NAMESPACE
              value: "sandbox"
            # Out of reach of kustomize `images:` — kept in sync with the Dockerfile
            # headers by make sync-versions. Both tags must already be in
            # containerd: the Jobs run imagePullPolicy: Never.
            - name: SANDBOX_JOB_IMAGE
              value: "ghcr.io/kayodevv/ubuntu-sandbox:v1.2.0"
            - name: SANDBOX_PDF_JOB_IMAGE
              value: "ghcr.io/kayodevv/ubuntu-pdf-sandbox:v1.2.1"
            - name: SANDBOX_TIMEOUT_S
              value: "300"
            # Hijack the sample's DNS to the sinkhole (split-DNS via hostAliases).
            - name: SANDBOX_DNS_SERVICE
              value: "sinkhole-dns.sinkhole.svc.cluster.local"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
