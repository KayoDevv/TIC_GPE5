# Analysis Job template — ONE per sample.
# The consumer instantiates this Job dynamically (job_id + sample_id substitution)
# via the K8s API. Kept as the source of truth for the isolation contract
# (seccomp, capabilities, resources, deadline).
#
# Runtime substitutions on the consumer side:
#   - metadata.name              <- charon-{job_id_short}
#   - spec.template.spec.containers[0].args
#       <- ["--job-id", "<uuid>", "--s3-url", "<presigned>"]
#   - metadata.labels.job-id     <- <uuid>
---
apiVersion: batch/v1
kind: Job
metadata:
  name: charon-analysis-TEMPLATE
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: charon
    charon.io/role: analysis
spec:
  backoffLimit: 0                 # no retry — one sample = one chance
  ttlSecondsAfterFinished: 120    # auto GC 2min — aligned with the runtime (consumer.py) and the spec
  activeDeadlineSeconds: 180      # hard kill if > 3min (sandbox SLA = 120s)
  template:
    metadata:
      labels:
        charon.io/role: analysis
    spec:
      restartPolicy: Never
      serviceAccountName: sandbox-analysis
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      # Hardening Tranche B — V3: gVisor is now MANDATORY. The consumer injects
      # runtimeClassName=gvisor at runtime (SANDBOX_RUNTIME_CLASS env) and the
      # ValidatingAdmissionPolicy `charon-require-gvisor-detonation` rejects any
      # analysis pod without it. This template line stays commented because the
      # value is set at runtime, not baked in here.
      # runtimeClassName: gvisor
      # Hardening Tranche B — V7: sinkhole DNS (replace with actual ClusterIP)
      # dnsPolicy: None
      # dnsConfig:
      #   nameservers: ["10.43.X.Y"]   # sinkhole-dns ClusterIP
      #   searches:
      #     - sandbox.svc.cluster.local
      #     - svc.cluster.local
      #     - cluster.local
      #   options:
      #     - {name: ndots, value: "2"}
      # Optional but recommended: dedicated bursty node pool.
      # nodeSelector:
      #   charon.io/workload: sandbox-analysis
      # tolerations:
      #   - key: charon.io/sandbox
      #     operator: Exists
      #     effect: NoSchedule
      containers:
        - name: analysis
          image: ghcr.io/kayodevv/ubuntu-sandbox:v1
          imagePullPolicy: IfNotPresent
          command: ["/opt/agent/run_analysis.sh"]
          args: ["--job-id", "REPLACED_BY_CONSUMER", "--s3-url", "REPLACED_BY_CONSUMER"]
          resources:
            requests: {cpu: "500m", memory: "512Mi", ephemeral-storage: "1Gi"}
            limits: {cpu: "2000m", memory: "2Gi", ephemeral-storage: "2Gi"}
          securityContext:
            # Hardening Tranche B — V5: non-root user `agent` (UID=10001).
            # The Dockerfile creates the user; SYS_PTRACE is propagated to ambient
            # caps when runAsUser != 0 (modern containerd) and a `setcap`
            # fallback on /usr/bin/strace covers older runtimes.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_PTRACE"]    # strict minimum for strace
            # Hardening Tranche A — V2 : RuntimeDefault (containerd/Docker default).
            # Tranche B (target) : Localhost + charon-seccomp.json (Charon-strict).
            # Once seccomp-distributor.yaml has populated the profile on every
            # node, switch the type to Localhost.
            seccompProfile:
              type: RuntimeDefault
              # type: Localhost
              # localhostProfile: charon-seccomp.json
          env:
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
          volumeMounts:
            - name: scratch
              mountPath: /out
            # Hardening Tranche A — V6: with a read-only rootfs, /tmp and /var/tmp
            # must be writable for Python tempfile, gcc, pip, etc.
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
            medium: ""              # disk, not tmpfs (PCAP can be large)
        - name: tmp
          emptyDir:
            medium: Memory          # tmpfs RAM, counted in the pod's memory limit
            sizeLimit: 256Mi
        - name: var-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
