# Analysis Job — one per sample, instantiated dynamically by the consumer via the
# K8s API. Source of truth for the isolation contract (seccomp, caps, resources).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: charon-analysis-TEMPLATE
  namespace: sandbox
  labels:
    app.kubernetes.io/part-of: charon
    charon.io/role: analysis
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        charon.io/role: analysis
    spec:
      restartPolicy: Never
      serviceAccountName: sandbox-analysis
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      # Injected at runtime by the consumer (not baked here):
      #   runtimeClassName: gvisor          (mandatory, enforced by the gvisor VAP)
      #   dnsConfig + hostAliases           (sinkhole DNS + split-DNS)
      containers:
        - name: analysis
          # Tag written out: the consumer applies this file, not kustomize.
          # Never: the Job has no pull secret, so a pull can only 401.
          image: ghcr.io/kayodevv/ubuntu-sandbox:v1.2.0
          imagePullPolicy: Never
          # PDF path uses run_pdf_analysis.py + the ubuntu-pdf-sandbox image.
          command: ["python3", "/opt/agent/run_analysis.py"]
          args: ["--job-id", "REPLACED_BY_CONSUMER", "--s3-url", "REPLACED_BY_CONSUMER"]
          resources:
            requests: {cpu: "500m", memory: "512Mi", ephemeral-storage: "1Gi"}
            limits: {cpu: "2000m", memory: "2Gi", ephemeral-storage: "2Gi"}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_PTRACE"]   # strict minimum for strace
            seccompProfile:
              type: RuntimeDefault
              # Switch to Localhost once charon-seccomp.json is on every node:
              # type: Localhost
              # localhostProfile: charon-seccomp.json
          env:
            - name: MINIO_ENDPOINT
              value: "minio.minio.svc.cluster.local:9000"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
          volumeMounts:
            - name: scratch
              mountPath: /out
            # Writable temp required by the read-only rootfs.
            - name: tmp
              mountPath: /tmp
            - name: var-tmp
              mountPath: /var/tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
            medium: ""              # disk, not tmpfs (PCAP can be large)
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: var-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
