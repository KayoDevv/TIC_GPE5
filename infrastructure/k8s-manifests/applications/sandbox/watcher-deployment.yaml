# minio-watcher — MinIO events → FileRequestedEvent transformer.
# Listens on the minio.events topic (native MinIO S3 notifications),
# generates a FileRequestedEvent and publishes to file.requested.
#
# Security — least privilege:
#   - ServiceAccount with no K8s API rights
#   - automountServiceAccountToken: false
#   - runAsNonRoot, readOnlyRootFilesystem, drop ALL caps, seccomp RuntimeDefault
#   - NetworkPolicy egress: Kafka + MinIO only (no K8s API)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-watcher
  namespace: sandbox
  labels:
    app.kubernetes.io/name: minio-watcher
    app.kubernetes.io/part-of: charon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-watcher
  template:
    metadata:
      labels:
        app: minio-watcher
    spec:
      serviceAccountName: sandbox-watcher
      automountServiceAccountToken: false
      containers:
        - name: watcher
          image: ghcr.io/kayodevv/charon-minio-watcher:latest
          imagePullPolicy: IfNotPresent
          env:
            # IP of the K8s node where this pod runs (injected via DownwardAPI).
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Fallback endpoints ($(NODE_IP) resolved to the node IP).
            # Overridden by overlays/dev/watcher-env-patch.yaml to point
            # to the in-cluster K8s DNS.
            - name: KAFKA_BOOTSTRAP
              value: "$(NODE_IP):9093"
            - name: MINIO_ENDPOINT
              value: "$(NODE_IP):9000"
            - name: MINIO_PRESIGN_ENDPOINT
              value: "$(NODE_IP):9000"
            # Constants.
            - name: MINIO_TOPIC_IN
              value: "minio.events"
            - name: KAFKA_TOPIC_OUT
              value: "file.requested"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MINIO_BUCKET
              value: "sandbox-reports"
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10002
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
