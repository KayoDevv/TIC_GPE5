---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-consumer
  namespace: sandbox
---
# The consumer creates Jobs (one per sample). No delete: the Job's
# ownerReference handles GC via TTLAfterFinished.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-job-dispatcher
  namespace: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-consumer-can-dispatch
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-consumer
    namespace: sandbox
roleRef:
  kind: Role
  name: sandbox-job-dispatcher
  apiGroup: rbac.authorization.k8s.io
---
# Separate ServiceAccount for the analysis Jobs — no K8s API rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-analysis
  namespace: sandbox
automountServiceAccountToken: false
---
# ServiceAccount for minio-watcher — no K8s API rights.
# The watcher only reads/writes Kafka messages and computes checksums
# from MinIO. If compromised, it cannot create Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-watcher
  namespace: sandbox
automountServiceAccountToken: false
