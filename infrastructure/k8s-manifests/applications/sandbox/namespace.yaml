apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    app.kubernetes.io/part-of: charon
    # Pod Security Admission = privileged (INTENTIONAL).
    # The analysis Jobs add CAP_SYS_PTRACE (required by `strace -f`), and
    # SYS_PTRACE is NOT in the `baseline` or `restricted` capability allow-list
    # (allow-list = NET_BIND_SERVICE, CHOWN, SETUID… without SYS_PTRACE)
    # → both levels REJECT the Jobs at admission. Hence `privileged` here.
    # The real hardening lives in the Jobs' securityContext (consumer.py):
    # runAsNonRoot, allowPrivilegeEscalation=false, readOnlyRootFilesystem,
    # cap-drop ALL (add SYS_PTRACE only), seccomp RuntimeDefault/Localhost.
    # Hardening target: empirically prove that `strace -f` works WITHOUT the
    # cap add (child tracing, default ptrace_scope) → drop the add →
    # switch to baseline/restricted and regain the admission-time guardrail.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
