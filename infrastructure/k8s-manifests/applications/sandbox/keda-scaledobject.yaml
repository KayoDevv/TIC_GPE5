# Autoscaling du consumer sur le lag Kafka — ne dépasse pas le nombre de
# partitions de file.requested (3, provisionnées par Helm Bitnami
# kafka/values.yaml). Au-delà = consumers inactifs (un consumer par partition max).
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sandbox-consumer-scaler
  namespace: sandbox
spec:
  scaleTargetRef:
    name: sandbox-consumer
  minReplicaCount: 1
  maxReplicaCount: 3                # = partitions de file.requested
  pollingInterval: 15               # s
  cooldownPeriod: 120               # s — laisse un Job d'analyse finir avant scale-down
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.kafka.svc.cluster.local:9092
        consumerGroup: charon-sandbox-v1
        topic: file.requested
        lagThreshold: "5"           # 1 réplica supplémentaire par 5 messages en retard
        offsetResetPolicy: earliest
---
# Garde-fou : le namespace ne peut JAMAIS faire tourner plus de 6 analyses
# simultanées même si KEDA délire. Protège le cluster contre une rafale.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-namespace-quota
  namespace: sandbox
spec:
  hard:
    pods: "12"                      # jusqu'à 3 consumers + jobs d'analyse
    requests.cpu: "10"
    requests.memory: "16Gi"
    limits.cpu: "20"
    limits.memory: "20Gi"
    count/jobs.batch: "30"
