# Consumer autoscaling on Kafka lag — never exceeds the number of
# file.requested partitions (3, provisioned by Helm Bitnami kafka/values.yaml).
# Beyond that = idle consumers (one consumer per partition max).
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sandbox-consumer-scaler
  namespace: sandbox
spec:
  scaleTargetRef:
    name: sandbox-consumer
  minReplicaCount: 1
  maxReplicaCount: 3                # = file.requested partitions
  pollingInterval: 15               # s
  cooldownPeriod: 120               # s — lets an analysis Job finish before scale-down
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.kafka.svc.cluster.local:9092
        consumerGroup: charon-sandbox-v1
        topic: file.requested
        lagThreshold: "5"           # +1 replica per 5 lagging messages
        offsetResetPolicy: earliest
---
# Guard: the namespace can NEVER run more than ~6 analyses simultaneously
# even if KEDA goes haywire. Protects the cluster against a burst.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-namespace-quota
  namespace: sandbox
spec:
  hard:
    pods: "12"                      # up to 3 consumers + analysis jobs
    requests.cpu: "10"
    requests.memory: "16Gi"
    limits.cpu: "20"
    limits.memory: "20Gi"
    count/jobs.batch: "30"
