# MinIO credentials for the sandbox-consumer — used ONLY to presign the sample's
# s3:// URL into a short-lived https link for the (credential-less) detonation
# pod. The pod itself never gets these secrets. Mirrors applications/pipeline/
# secret-s3.yaml (dev creds minioadmin). Phase 9 hardening: ESO + Vault.
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-s3
  namespace: sandbox
type: Opaque
stringData:
  ACCESS_KEY: minioadmin
  SECRET_KEY: minioadmin
