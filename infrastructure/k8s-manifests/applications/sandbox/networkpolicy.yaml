# Network isolation of the sandbox namespace (enforced by Calico).
#
# Pure namespaceSelector + DNS rules (everything in-cluster):
# - Consumer: can egress to Kafka, MinIO, K8s API.
# - Watcher : Kafka + MinIO only (NO K8s API — least privilege).
# - Analysis Jobs: Kafka (results) + MinIO (sample download).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consumer-egress
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: sandbox-consumer
  policyTypes: [Egress]
  egress:
    # Kafka in-cluster (prod service). Schema Registry removed → no more 8081.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kafka}
      ports:
        - {protocol: TCP, port: 9092}
    # MinIO in K8s (in-cluster service, prod)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: minio}
      ports:
        - {protocol: TCP, port: 9000}
    # K8s API — handled by a SEPARATE, generated policy (`consumer-apiserver-egress`).
    # The kube-apiserver is host-networked, so a `namespaceSelector` on the
    # `default` ns never matches it (it is NOT a pod). Calico enforces `ipBlock`
    # correctly, but the node IP is host-specific, so it is injected at deploy
    # time from the auto-discovered NODE_IP via `make netpol-apiserver`
    # (template: consumer-apiserver-egress.yaml.tmpl). No hardcoded IP in git.
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Watcher: Kafka (read minio.events + publish file.requested) + MinIO
# (SHA-256 computation + presigned URLs). No K8s API access — if compromised,
# it cannot create Jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: watcher-egress
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: minio-watcher
  policyTypes: [Egress]
  egress:
    # Kafka — service in-cluster (prod)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kafka}
      ports:
        - {protocol: TCP, port: 9092}
    # MinIO — service in-cluster (prod)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: minio}
      ports:
        - {protocol: TCP, port: 9000}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Analysis Jobs: egress limited to Kafka (result publication) and MinIO
# (sample download). A malicious sample cannot reach the Internet or any
# other internal service — only the two infra endpoints are allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analysis-egress
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      charon.io/role: analysis
  policyTypes: [Egress]
  egress:
    # Kafka — in-cluster service (prod)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kafka}
      ports:
        - {protocol: TCP, port: 9092}
    # MinIO — in-cluster service (prod)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: minio}
      ports:
        - {protocol: TCP, port: 9000}
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
