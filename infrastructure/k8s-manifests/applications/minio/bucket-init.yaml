# Initialization Job for the sandbox-reports bucket + Kafka notification.
# Idempotent: can be re-applied without breaking an existing bucket.
#
# Creates:
#   - Bucket `sandbox-reports`
#   - charon ARN notification → Kafka topic minio.events on PUT events
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: minio
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -fsS http://minio.minio.svc.cluster.local:9000/minio/health/ready; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              echo "MinIO is ready."
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: init-bucket
          # Matches the MinIO 2023-01 release used by the StatefulSet (x86-64-v1 compat).
          # mc after 2023-03 = GOAMD64=v2 → crashes on the baseline CPU.
          image: quay.io/minio/mc:RELEASE.2023-01-28T20-29-38Z
          command:
            - sh
            - -c
            - |
              set -e
              mc alias set local http://minio.minio.svc.cluster.local:9000 minioadmin minioadmin

              # Create bucket (no-op if already present)
              mc mb -p local/sandbox-reports || true

              # Kafka notification (no-op if the ARN is already configured)
              mc event add local/sandbox-reports arn:minio:sqs::charon:kafka \
                --event put --suffix .pdf,.exe,.elf 2>&1 | grep -v "already exists" || true

              # Final listing for the log
              echo "=== Buckets ==="
              mc ls local
              echo "=== Events on sandbox-reports ==="
              mc event list local/sandbox-reports
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
