# Job d'initialisation du bucket sandbox-reports + notification Kafka.
# Idempotent : peut être ré-appliqué sans casser un bucket existant.
#
# Crée :
#   - Bucket `sandbox-reports`
#   - Notification ARN charon → topic Kafka minio.events sur événements PUT
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: minio
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: curlimages/curl:8.5.0
          command:
            - sh
            - -c
            - |
              until curl -fsS http://minio.minio.svc.cluster.local:9000/minio/health/ready; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              echo "MinIO is ready."
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: init-bucket
          # Match la release MinIO 2023-01 utilisée par le StatefulSet (CPU v1 compat).
          # mc post 2023-03 = GOAMD64=v2 → crash sur CPU baseline.
          image: quay.io/minio/mc:RELEASE.2023-01-28T20-29-38Z
          command:
            - sh
            - -c
            - |
              set -e
              mc alias set local http://minio.minio.svc.cluster.local:9000 minioadmin minioadmin

              # Création bucket (no-op si déjà présent)
              mc mb -p local/sandbox-reports || true

              # Notification Kafka (no-op si ARN déjà configuré)
              mc event add local/sandbox-reports arn:minio:sqs::charon:kafka \
                --event put --suffix .pdf,.exe,.elf 2>&1 | grep -v "already exists" || true

              # Liste finale pour log
              echo "=== Buckets ==="
              mc ls local
              echo "=== Events sur sandbox-reports ==="
              mc event list local/sandbox-reports
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
