# Kustomization for the in-cluster MinIO namespace:
#   - namespace `minio`
#   - standalone StatefulSet + Service `minio` (DNS minio.minio.svc.cluster.local:9000)
#     defined in tenant.yaml (pivoted away from the MinIO Operator Tenant CR —
#     see tenant.yaml header for the x86-64-v1 CPU rationale)
#   - credentials Secret
#   - bucket-init Job (bucket creation + Kafka notification)
#
# Prerequisite: none (no MinIO Operator — plain StatefulSet).
#
# Deploy: kubectl apply -k infrastructure/k8s-manifests/applications/minio/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minio

resources:
  # namespace `minio`: owned by Terraform (infrastructure/terraform/namespaces.tf)
  - tenant.yaml
  - bucket-init.yaml
