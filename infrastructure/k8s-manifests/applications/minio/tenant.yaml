# MinIO standalone StatefulSet (pivoted off the MinIO Operator, 2026-05-13).
# The GPE-NYX VM is x86-64-v1 (no SSE4.2); MinIO builds after 2023-03 use GOAMD64=v2
# and crash ("CPU does not support x86-64-v2"), so the image is pinned to the last
# v1-compatible build (RELEASE.2023-01-25), which Operator v5 won't manage — hence a
# plain StatefulSet. Phase 9: host-passthrough CPU → Operator + recent MinIO.
---
# Credentials Secret (Phase 9 hardening: External Secrets Operator + Vault)
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # Last MinIO release built for x86-64-v1 (January 2023).
          # Later versions require v2 (SSE4.2/POPCNT).
          image: quay.io/minio/minio:RELEASE.2023-01-25T00-19-54Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          envFrom:
            - secretRef:
                name: minio-creds
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName left empty → uses local-path (K3s default)
        resources:
          requests:
            storage: 5Gi
---
# `minio` ClusterIP Service — DNS minio.minio.svc.cluster.local:9000
# (shorthand aligned with overlays/prod, consumer/watcher env vars).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
---
# Headless Service required by the StatefulSet (stable per-pod DNS).
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: minio
  labels:
    app: minio
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
