# Website — static Nuxt page that hands out the extension ZIP baked into the
# image. Lives in the `pipeline` namespace to reuse the ghcr-pull secret; it
# talks to nothing in-cluster (the extension calls core-backend directly from
# the user's browser).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: pipeline
  labels:
    app: website
    app.kubernetes.io/part-of: charon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: website
          image: ghcr.io/kayodevv/charon-website
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101              # nginx-unprivileged
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: pipeline
spec:
  type: NodePort
  selector:
    app: website
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
