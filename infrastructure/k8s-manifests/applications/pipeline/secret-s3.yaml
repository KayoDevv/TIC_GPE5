# S3/MinIO credentials for the pipeline workers (core-backend upload, ml-layer
# download). Mirrors applications/minio/tenant.yaml (dev creds minioadmin).
# Phase 9 hardening: External Secrets Operator + Vault.
#
# NOTE: the LLM Layer's HF_TOKEN is a real secret and is NOT committed. Create it
# out-of-band before deploying:
#   kubectl -n pipeline create secret generic llm-secrets \
#     --from-literal=HF_TOKEN=hf_xxx
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-s3
  namespace: pipeline
type: Opaque
stringData:
  ACCESS_KEY: minioadmin
  SECRET_KEY: minioadmin
