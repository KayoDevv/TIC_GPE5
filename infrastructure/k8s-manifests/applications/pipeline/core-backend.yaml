# Core Backend — FastAPI API gateway (the extension's entry point).
# Produces file.requested, consumes verdict.result, streams verdicts over WS.
# Exposed on the LAN via NodePort 30080 (this IS the intended ingress; unlike
# Kafka/MinIO it is safe to expose).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-backend
  namespace: pipeline
  labels:
    app: core-backend
    app.kubernetes.io/part-of: charon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-backend
  template:
    metadata:
      labels:
        app: core-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull        # ghcr charon packages are private; created once on the node
      containers:
        - name: core-backend
          image: ghcr.io/kayodevv/charon-core-backend:latest  # bumped by CD to a sha- tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"
            - name: S3_ENDPOINT_URL
              value: "http://minio.minio.svc.cluster.local:9000"
            - name: S3_BUCKET_NAME
              value: "zero-trust-files"
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: pipeline-s3, key: ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: pipeline-s3, key: SECRET_KEY}}
            # SSO/JWKS is not wired yet -> dev auth bypass so the extension can
            # actually reach /analyze + /ws. Replace with real JWKS in Phase 9.
            - name: AUTH_DEV_MODE
              value: "true"
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "384Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10004
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp          # SpooledTemporaryFile spill for large uploads
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: core-backend
  namespace: pipeline
spec:
  type: NodePort
  selector:
    app: core-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
