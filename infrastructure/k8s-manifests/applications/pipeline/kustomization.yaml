apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pipeline
# The `pipeline` namespace + the kafka-allow NetworkPolicy ingress rule are owned
# by Terraform (namespaces.tf, networkpolicy.tf). The `llm-secrets` secret
# (HF_TOKEN) is created out-of-band and is NOT in this kustomization.
resources:
  - charon-endpoints.yaml
  - secret-s3.yaml
  - redis.yaml
  - core-backend.yaml
  - ml-layer.yaml
  - verdict-layer.yaml
  - llm-layer.yaml

# Derived from the Dockerfile headers by `make sync-versions`.
images:
  - name: ghcr.io/kayodevv/charon-core-backend
    newTag: v1.0.3
  - name: ghcr.io/kayodevv/charon-ml-layer
    newTag: v1.1.0
  - name: ghcr.io/kayodevv/charon-verdict-layer
    newTag: v1.0.1
  - name: ghcr.io/kayodevv/charon-llm-layer
    newTag: v1.0.1
