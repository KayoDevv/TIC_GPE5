# DEV-ONLY Kafka NodePort overlay — re-enables host access for the validator/feeder.
# NEVER in prod (prod keeps externalAccess.enabled=false → ClusterIP only).
# Merged after values.yaml; wired into `make dev-expose` / reverted by `dev-teardown`.
externalAccess:
  enabled: true
  autoDiscovery:
    enabled: false
  controller:
    forceExpose: true
    service:
      type: NodePort
      ports:
        external: 9094
      nodePorts:
        - 32092
      # K3s node LAN IP — forced so Kafka advertises the right address to the
      # host client (validator/feeder). Adjust to the dev node's LAN IP.
      domain: 172.16.249.133
