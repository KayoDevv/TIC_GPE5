# Kustomization for the in-cluster Kafka namespace (Bitnami pivot).
#
# Kafka itself is deployed via Helm (bitnami/kafka chart, see values.yaml and
# the `setup-kafka` Makefile target). This kustomization now only manages the
# namespace: topic provisioning is included in the Bitnami chart.
#
# NB: Schema Registry + schema-init were removed (unused in v1 — no runtime
# schema validation, see consumer.py). The JSON schemas remain in
# packages/kafka-schemas/ as the LLM/ML cross-team contract.
#
# Deploy: `kubectl apply -k infrastructure/k8s-manifests/applications/kafka/`
#         (run after the Kafka helm install — see `make setup-kafka`)
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

resources:
  - namespace.yaml
