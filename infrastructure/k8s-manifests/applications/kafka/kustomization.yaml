# Kustomization namespace Kafka in-cluster (pivot Bitnami).
#
# Kafka lui-même est déployé via Helm (chart bitnami/kafka, cf. values.yaml
# et Makefile cible `setup-kafka`). Cette kustomization ne gère plus que le
# namespace : le provisioning des topics est inclus dans le chart Bitnami.
#
# NB : Schema Registry + schema-init ont été retirés (non utilisés en v1 —
# aucune validation de schéma au runtime, cf. consumer.py). Les schémas JSON
# restent dans packages/kafka-schemas/ comme contrat inter-équipes LLM/ML.
#
# Deploy : `kubectl apply -k infrastructure/k8s-manifests/applications/kafka/`
#          (lance après le helm install Kafka — voir `make setup-kafka`)
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

resources:
  - namespace.yaml
