# Bitnami Kafka Helm chart values — pivot Bitnami du 2026-05-13.
#
# Pourquoi Bitnami plutôt que Strimzi :
#   - Strimzi 0.40/0.46 crashent en init sur K3s v1.35 (Vert.x event loop
#     bloqué > 9s lors de la découverte des APIs K8s 1.35 absentes de leur
#     matrice de compat).
#   - Bitnami chart = StatefulSet + Service standard, pas d'operator, pas
#     d'API discovery exotique → compat universelle.
#
# Mode KRaft combined (le pod controller-0 fait controller ET broker).
# Pas de Zookeeper → moins de RAM, moins de pods, démarrage plus rapide.
#
# Chart version : 31.0.0 (Kafka 3.7.1, voir Makefile KAFKA_CHART_VERSION)
# Usage :
#   helm upgrade --install kafka bitnami/kafka -n kafka --version 31.0.0 \
#     -f infrastructure/k8s-manifests/applications/kafka/values.yaml

# ─────────────────────────────────────────────────────────────────────
# Image : bitnamilegacy/kafka (registry gratuit avec tous les tags)
# Bitnami a restreint docker.io/bitnami/kafka aux tags `latest` + majeurs
# (Bitnami Secure Images, août 2024). Les versions épinglées (3.9.0, etc.)
# nécessitent un abonnement payant OU le mirror legacy `bitnamilegacy/*`.
# ─────────────────────────────────────────────────────────────────────
image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  pullPolicy: IfNotPresent

# Mêmes overrides pour les sous-images du chart
kraft:
  enabled: true

controller:
  replicaCount: 1
  # Note: en mode combined, controller-0 joue aussi le rôle de broker.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  persistence:
    enabled: true
    size: 5Gi
    # storageClass laissé vide → utilise la StorageClass par défaut de K3s (local-path)
  logPersistence:
    enabled: false   # logs Kafka dans le PV de persistence, pas séparés

broker:
  replicaCount: 0   # pas de brokers séparés en combined mode

# ─────────────────────────────────────────────────────────────────────
# Auth & TLS — PLAINTEXT pour dev/RNCP (durcissement Phase 9)
# ─────────────────────────────────────────────────────────────────────
listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

# Auth client : sans SASL, sans TLS
sasl:
  enabledMechanisms: ""
  interBrokerMechanism: ""
  controllerMechanism: ""
tls:
  type: jks
  autoGenerated:
    engine: helm
    enabled: false

# ─────────────────────────────────────────────────────────────────────
# Service externe — NodePort 32092 pour le validator sur le host
# IMPORTANT : domain forcé sur l'IP LAN du node (172.16.249.133), sinon
# Kafka advertise l'ExternalIP détectée par K3s (peut être une IP publique
# non joignable depuis le host).
# ─────────────────────────────────────────────────────────────────────
externalAccess:
  enabled: true
  autoDiscovery:
    enabled: false
  controller:
    forceExpose: true
    service:
      type: NodePort
      ports:
        external: 9094
      nodePorts:
        - 32092
      # IP LAN du node K3s — forcée pour que Kafka advertise la bonne
      # adresse au client (validator/feeder qui tournent sur le host).
      domain: 172.16.249.133

# ─────────────────────────────────────────────────────────────────────
# Configuration broker — réplication 1 partout (dev mono-node)
# ─────────────────────────────────────────────────────────────────────
extraConfig: |
  default.replication.factor=1
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
  min.insync.replicas=1
  auto.create.topics.enable=false
  log.retention.hours=1

# ─────────────────────────────────────────────────────────────────────
# Provisioning automatique des 6 topics (remplace scripts/kafka-init.sh)
# Reprend exactement la config de scripts/kafka-init.sh : 3 partitions,
# retention 3600000ms (1h). Exception : minio.events = 1 partition.
# ─────────────────────────────────────────────────────────────────────
provisioning:
  enabled: true
  replicationFactor: 1
  numPartitions: 3
  # Override image legacy aussi pour le Job provisioning
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  topics:
    - name: file.requested
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: ml_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: sandbox_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: llm_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: verdict.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: minio.events
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "3600000"

# ─────────────────────────────────────────────────────────────────────
# Service interne — nom `kafka` (DNS kafka.kafka.svc.cluster.local:9092)
# Aligné avec overlays/prod, KEDA scaledobject, analysis-job-template,
# CLAUDE.md — pas d'alias service nécessaire (le chart utilise ce nom natif).
# ─────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  ports:
    client: 9092

# ─────────────────────────────────────────────────────────────────────
# Désactive les composants optionnels (réduit l'empreinte mémoire ~200Mi)
# ─────────────────────────────────────────────────────────────────────
kafkaExporter:
  enabled: false   # Prometheus metrics — activer Phase 9
metrics:
  jmx:
    enabled: false
  kafka:
    enabled: false
networkPolicy:
  enabled: false   # géré par les NetworkPolicies du namespace sandbox
