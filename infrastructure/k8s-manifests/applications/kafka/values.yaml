# Bitnami Kafka Helm chart values — Bitnami pivot of 2026-05-13.
#
# Why Bitnami instead of Strimzi:
#   - Strimzi 0.40/0.46 crash on init on K3s v1.35 (Vert.x event loop blocked
#     > 9s while discovering K8s 1.35 APIs missing from their compat matrix).
#   - Bitnami chart = standard StatefulSet + Service, no operator, no exotic
#     API discovery → universal compatibility.
#
# KRaft combined mode (the controller-0 pod is BOTH controller AND broker).
# No Zookeeper → less RAM, fewer pods, faster startup.
#
# Chart version: 31.0.0 (Kafka 3.7.1, see Makefile KAFKA_CHART_VERSION)
# Usage:
#   helm upgrade --install kafka bitnami/kafka -n kafka --version 31.0.0 \
#     -f infrastructure/k8s-manifests/applications/kafka/values.yaml

# ─────────────────────────────────────────────────────────────────────
# Image: bitnamilegacy/kafka (free registry with all tags)
# Bitnami restricted docker.io/bitnami/kafka to the `latest` + major tags
# (Bitnami Secure Images, Aug 2024). Pinned versions (3.9.0, etc.) require a
# paid subscription OR the legacy mirror `bitnamilegacy/*`.
# ─────────────────────────────────────────────────────────────────────
image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  pullPolicy: IfNotPresent

# Same overrides for the chart sub-images
kraft:
  enabled: true

controller:
  replicaCount: 1
  # Note: in combined mode, controller-0 also acts as the broker.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  persistence:
    enabled: true
    size: 5Gi
    # storageClass left empty → uses the K3s default StorageClass (local-path)
  logPersistence:
    enabled: false   # Kafka logs in the persistence PV, not separated

broker:
  replicaCount: 0   # no separate brokers in combined mode

# ─────────────────────────────────────────────────────────────────────
# Auth & TLS — PLAINTEXT for dev/RNCP (hardening in Phase 9)
# ─────────────────────────────────────────────────────────────────────
listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

# Client auth: no SASL, no TLS
sasl:
  enabledMechanisms: ""
  interBrokerMechanism: ""
  controllerMechanism: ""
tls:
  type: jks
  autoGenerated:
    engine: helm
    enabled: false

# ─────────────────────────────────────────────────────────────────────
# External service — NodePort 32092 for the validator running on the host.
# IMPORTANT: domain forced to the node's LAN IP (172.16.249.133), otherwise
# Kafka advertises the ExternalIP detected by K3s (which may be a public IP
# unreachable from the host).
# ─────────────────────────────────────────────────────────────────────
externalAccess:
  enabled: true
  autoDiscovery:
    enabled: false
  controller:
    forceExpose: true
    service:
      type: NodePort
      ports:
        external: 9094
      nodePorts:
        - 32092
      # K3s node LAN IP — forced so Kafka advertises the right address to the
      # client (validator/feeder running on the host).
      domain: 172.16.249.133

# ─────────────────────────────────────────────────────────────────────
# Broker configuration — replication factor 1 everywhere (single-node dev)
# ─────────────────────────────────────────────────────────────────────
extraConfig: |
  default.replication.factor=1
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
  min.insync.replicas=1
  auto.create.topics.enable=false
  log.retention.hours=1

# ─────────────────────────────────────────────────────────────────────
# Automatic provisioning of the 6 topics (replaces scripts/kafka-init.sh).
# Mirrors the scripts/kafka-init.sh config exactly: 3 partitions, retention
# 3600000ms (1h). Exception: minio.events = 1 partition.
# ─────────────────────────────────────────────────────────────────────
provisioning:
  enabled: true
  replicationFactor: 1
  numPartitions: 3
  # Legacy image override for the provisioning Job too
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  topics:
    - name: file.requested
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: ml_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: sandbox_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: llm_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: verdict.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: minio.events
      partitions: 1
      replicationFactor: 1
      config:
        retention.ms: "3600000"

# ─────────────────────────────────────────────────────────────────────
# Internal service — name `kafka` (DNS kafka.kafka.svc.cluster.local:9092).
# Aligned with overlays/prod, the KEDA ScaledObject, analysis-job-template,
# and CLAUDE.md — no service alias needed (the chart uses this name natively).
# ─────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  ports:
    client: 9092

# ─────────────────────────────────────────────────────────────────────
# Disable optional components (cuts the memory footprint by ~200Mi)
# ─────────────────────────────────────────────────────────────────────
kafkaExporter:
  enabled: false   # Prometheus metrics — enable in Phase 9
metrics:
  jmx:
    enabled: false
  kafka:
    enabled: false
networkPolicy:
  enabled: false   # handled by the sandbox namespace NetworkPolicies
