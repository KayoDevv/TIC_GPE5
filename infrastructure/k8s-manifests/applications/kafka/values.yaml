# Bitnami Kafka values (pivot off Strimzi 2026-05-13: Strimzi crashed on K3s v1.35
# API discovery; Bitnami = plain StatefulSet, universal). KRaft combined mode
# (controller-0 is both controller and broker, no Zookeeper). Chart 31.0.0 (Kafka 3.7.1).

# ─────────────────────────────────────────────────────────────────────
# Image: bitnamilegacy/kafka (free registry with all tags)
# Bitnami restricted docker.io/bitnami/kafka to the `latest` + major tags
# (Bitnami Secure Images, Aug 2024). Pinned versions (3.9.0, etc.) require a
# paid subscription OR the legacy mirror `bitnamilegacy/*`.
# ─────────────────────────────────────────────────────────────────────
image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  pullPolicy: IfNotPresent

# Same overrides for the chart sub-images
kraft:
  enabled: true

controller:
  replicaCount: 1
  # Note: in combined mode, controller-0 also acts as the broker.
  # Memory bumped 1Gi -> 2Gi: at a 1Gi limit the JVM heap (~1Gi default) plus
  # off-heap (page cache, metaspace, threads) pushed RSS over the limit and the
  # container was OOMKilled repeatedly (exit 137). 2Gi gives the off-heap room.
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  persistence:
    enabled: true
    size: 5Gi
    # storageClass left empty → uses the K3s default StorageClass (local-path)
  logPersistence:
    enabled: false   # Kafka logs in the persistence PV, not separated

broker:
  replicaCount: 0   # no separate brokers in combined mode

# ─────────────────────────────────────────────────────────────────────
# Auth & TLS — PLAINTEXT for dev/RNCP (hardening in Phase 9)
# ─────────────────────────────────────────────────────────────────────
listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

# Client auth: no SASL, no TLS
sasl:
  enabledMechanisms: ""
  interBrokerMechanism: ""
  controllerMechanism: ""
tls:
  type: jks
  autoGenerated:
    engine: helm
    enabled: false

# ─────────────────────────────────────────────────────────────────────
# External access — DISABLED by default (prod). In prod Kafka is reachable only
# in-cluster via kafka.kafka.svc.cluster.local:9092; NO NodePort on the node/LAN
# (a LAN-exposed broker = verdict forgery on verdict.result — red team finding).
# The host-side validator/feeder need a NodePort ONLY in dev: it is re-enabled by
# `make dev-expose`, which merges values-dev.yaml (the full externalAccess block).
# ─────────────────────────────────────────────────────────────────────
externalAccess:
  enabled: false

# ─────────────────────────────────────────────────────────────────────
# Broker configuration — replication factor 1 everywhere (single-node dev)
# ─────────────────────────────────────────────────────────────────────
extraConfig: |
  default.replication.factor=1
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
  min.insync.replicas=1
  auto.create.topics.enable=false
  log.retention.hours=1

# ─────────────────────────────────────────────────────────────────────
# Automatic provisioning of the 6 topics (replaces scripts/kafka-init.sh).
# Mirrors the scripts/kafka-init.sh config exactly: 3 partitions, retention
# 3600000ms (1h).
# ─────────────────────────────────────────────────────────────────────
provisioning:
  enabled: true
  replicationFactor: 1
  numPartitions: 3
  # Legacy image override for the provisioning Job too
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  topics:
    - name: file.requested
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: ml_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: sandbox_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: llm_layer.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"
    - name: verdict.result
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "3600000"

# ─────────────────────────────────────────────────────────────────────
# Internal service — name `kafka` (DNS kafka.kafka.svc.cluster.local:9092).
# Aligned with overlays/prod, the KEDA ScaledObject, analysis-job-template,
# and CLAUDE.md — no service alias needed (the chart uses this name natively).
# ─────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  ports:
    client: 9092

# ─────────────────────────────────────────────────────────────────────
# Disable optional components (cuts the memory footprint by ~200Mi)
# ─────────────────────────────────────────────────────────────────────
kafkaExporter:
  enabled: false   # Prometheus metrics — enable in Phase 9
metrics:
  jmx:
    enabled: false
  kafka:
    enabled: false
networkPolicy:
  enabled: false   # handled by the sandbox namespace NetworkPolicies
