[project]
name = "core-backend"
version = "0.1.0"
description = "FastAPI API Gateway for GPE-ETNA Zero-Trust platform"
authors = [{name = "GPE-ETNA Team"}]
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "backend", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.128.8"
uvicorn = { version = "^0.39.0", extras = ["standard"] }
aiokafka = "^0.12.0"
boto3 = "^1.42.97"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
pydantic = "^2.13.4"
pydantic-settings = "^2.6.0"
python-multipart = "^0.0.20"
httpx = "^0.28.1"
zt-shared = { path = "../../packages/core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^1.2.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.20"
mypy = "^1.13.0"
moto = { version = "^5.0.0", extras = ["s3"] }
types-boto3 = "^1.43.40"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"src/backend/dependencies.py" = ["B008"]
"src/backend/routes/*.py" = ["B008"]
"tests/*.py" = ["B017"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "jose"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka"
ignore_missing_imports = true
