[tool.poetry]
name = "core-backend"
version = "0.1.0"
description = "FastAPI API Gateway for GPE-ETNA Zero-Trust platform"
authors = ["GPE-ETNA Team"]
readme = "README.md"
packages = [{ include = "backend", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
aiokafka = "^0.12.0"
boto3 = "^1.35.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-multipart = "^0.0.12"
httpx = "^0.27.0"
zt-shared = { path = "../../packages/core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
moto = { version = "^5.0.0", extras = ["s3"] }
types-boto3 = "^1.35.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]