[tool.poetry]
name = "llm-layer"
version = "0.1.0"
description = "LLM Layer — The Semantic Analyst worker for GPE-ETNA (CHARON)"
authors = ["tisser_f <tisser_f@etna-alternance.net>"]
packages = [{ include = "llm_layer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
# Canonical Kafka events + Pydantic models + Kafka helpers (monorepo path dep).
zt-shared = { path = "../../../packages/core", develop = true }
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
pytest-asyncio = ">=0.24,<1.5"
pytest-cov = ">=6,<8"
respx = ">=0.22,<0.24"
ruff = ">=0.8,<0.16"
mypy = ">=1.13,<3.0"

[tool.poetry.scripts]
llm-layer = "llm_layer.worker:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src/llm_layer"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# zt_shared ships no py.typed marker yet; treat it as an untyped dependency
# rather than failing strict mode on every import from the shared package.
module = "zt_shared.*"
ignore_missing_imports = true
follow_imports = "skip"
