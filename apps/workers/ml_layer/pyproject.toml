[project]
name = "ml-layer"
version = "0.1.0"
description = "ML Layer — Static PDF analysis worker for GPE-ETNA"
authors = [{name = "GPE-ETNA Team"}]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "ml_layer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pikepdf = "^10.8"
onnxruntime = "^1.20"
numpy = "^2.4"
zt-shared = { path = "../../../packages/core", develop = true }
boto3 = "^1.35.0"
httpx = "^0.27.0"
pydantic-settings = "^2.5"

[tool.poetry.group.training.dependencies]
lightgbm = "^4.5"
scikit-learn = "^1.5"
pandas = "^2.2"
onnxmltools = "^1.13"
skl2onnx = "^1.17"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
pytest-asyncio = "^0.24"
ruff = "^0.8"
mypy = "^2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/ml_layer"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true

# Third-party libraries that ship no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "boto3.*"]
ignore_missing_imports = true
