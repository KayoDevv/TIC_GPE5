[tool.poetry]
name = "ml-layer"
version = "0.1.0"
description = "ML Layer — Static PDF analysis worker for GPE-ETNA"
authors = ["Antigravity <ai@zero-trust.local>"]
packages = [{include = "ml_layer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pikepdf = "^9.0"
onnxruntime = "^1.20"
numpy = "^1.26"

[tool.poetry.group.training.dependencies]
lightgbm = "^4.5"
scikit-learn = "^1.5"
pandas = "^2.2"
onnxmltools = "^1.13"
skl2onnx = "^1.17"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.8"
mypy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/ml_layer"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true
