[tool.poetry]
name = "verdict-layer"
version = "0.1.0"
description = "Verdict Layer - Aggregation Engine for the GPE-ETNA Zero-Trust platform"
authors = ["GPE-ETNA Team"]
readme = "README.md"
packages = [{ include = "verdict_layer", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
redis = "^5.2.0"
aiokafka = "^0.12.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
zt-shared = { path = "../../../packages/core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
fakeredis = "^2.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["zt_shared.*"]
ignore_missing_imports = true