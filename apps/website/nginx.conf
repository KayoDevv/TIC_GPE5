# Static site served by nginx-unprivileged (non-root, port 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The generated site is fully static; anything unknown falls back to the
    # SPA entry rather than a bare 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The extension build: force a download rather than an in-browser preview,
    # and never cache it, so a redeployed image hands out the new ZIP.
    location = /charon-extension.zip {
        types { } default_type application/zip;
        add_header Content-Disposition 'attachment; filename="charon-extension.zip"';
        add_header Cache-Control 'no-store';
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
