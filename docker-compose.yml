# Local dev cache only.
# Kafka and MinIO have been migrated in-cluster (Bitnami Kafka chart + MinIO StatefulSet).
# See: infrastructure/k8s-manifests/applications/{kafka,minio}/

services:
  redis:
    image: redis:7.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
