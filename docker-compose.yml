# Dev cache locale uniquement.
# Kafka et MinIO ont été migrés in-cluster (Bitnami Kafka chart + MinIO StatefulSet).
# Voir : infrastructure/k8s-manifests/applications/{kafka,minio}/

services:
  redis:
    image: redis:7.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
